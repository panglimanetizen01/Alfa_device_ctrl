name: Debian Runtime Installer

on:
  push:
    branches: [master]
    paths:
      - 'app/src/main/java/com/alfa/device_ctrl/RuntimeProfile.java'
      - 'app/src/main/java/com/alfa/device_ctrl/RuntimeInstaller.java'
      - 'app/src/main/java/com/alfa/device_ctrl/RuntimeEvidence.java'
      - 'app/src/test/java/com/alfa/device_ctrl/DebianRuntimeInstallerTest.java'
      - 'tools/build_proot_loader.sh'
      - '.github/workflows/debian-runtime-installer.yml'
  pull_request:
    branches: [master]
    paths:
      - 'app/src/main/java/com/alfa/device_ctrl/RuntimeProfile.java'
      - 'app/src/main/java/com/alfa/device_ctrl/RuntimeInstaller.java'
      - 'app/src/main/java/com/alfa/device_ctrl/RuntimeEvidence.java'
      - 'app/src/test/java/com/alfa/device_ctrl/DebianRuntimeInstallerTest.java'
      - 'tools/build_proot_loader.sh'
      - '.github/workflows/debian-runtime-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '9.2.1'
      - name: Prepare Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108"
      - name: Download pinned Debian rootfs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/test-fixtures
          URL="https://github.com/debuerreotype/docker-debian-artifacts/raw/14d91d295c23da6cc04d4bfe8b3d74a8a6c54e5c/bookworm/oci/blobs/rootfs.tar.gz"
          SHA="c6cbf97176c58c741329cd787e932a1e47931b35f5dc0f23db3e6e82924fef0f"
          curl -fL --retry 3 --retry-delay 1 "$URL" -o artifacts/test-fixtures/debian-bookworm-arm64.tar.gz
          printf '%s  %s\n' "$SHA" artifacts/test-fixtures/debian-bookworm-arm64.tar.gz | sha256sum -c -
      - name: Run Debian installer acceptance test
        shell: bash
        run: ./gradlew :app:test --no-daemon --stacktrace --tests com.alfa.device_ctrl.DebianRuntimeInstallerTest
