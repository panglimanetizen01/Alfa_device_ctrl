name: G8 Runtime Task Contract

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  g8-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2

      - name: Bash syntax
        shell: bash
        run: |
          bash -n tools/gate8_runtime_task.sh
          bash -n tools/runtime_task.sh
          bash -n tools/test_gate8_contract.sh

      - name: G8 contract test
        shell: bash
        run: bash tools/test_gate8_contract.sh

      - name: Protected gate source boundary
        shell: bash
        run: |
          changed=$(git diff-tree --no-commit-id --name-only -r HEAD^ HEAD)
          for path in $changed; do
            case "$path" in
              tools/gate7_runtime_session.sh)
                diff=$(git diff --unified=0 HEAD^ HEAD -- "$path")
                changed_lines=$(printf '%s\n' "$diff" | grep -Ec '^[+-][^-+]' || true)
                grep -Fq -- "-    elif [ \"\$E_RUNTIME\" != 'ubuntu' ]; then" <<< "$diff"
                grep -Fq -- "+    elif [ \"\$E_RUNTIME\" != 'debian' ]; then" <<< "$diff"
                grep -Fq -- "-        STATUS=BLOCKED; REASON='session runtime_id is not the selected runtime'" <<< "$diff"
                grep -Fq -- "+        STATUS=BLOCKED; REASON='session runtime_id is not the Debian acceptance runtime'" <<< "$diff"
                test "$changed_lines" -eq 4
                echo "G7_BASELINE_MIGRATION_ALLOWED=$path"
                ;;
              tools/gate1_*|tools/gate2_*|tools/execution_capability.sh|tools/gate3_*|tools/environment_contract.sh|tools/gate5_*|tools/runtime_bootstrap.sh|tools/gate7_*)
                echo "PROTECTED_SOURCE_CHANGED=$path"
                exit 1
                ;;
            esac
          done
          echo 'G1_G7_SOURCE_BOUNDARY=PASS'

      - name: No propagation fallback
        shell: bash
        run: |
          ! grep -q 'runtime_stage.sh' tools/gate8_runtime_task.sh
          ! grep -q 'runtime_stage.sh' tools/runtime_task.sh
          ! grep -q 'run_20260823_171233_30513' tools/gate8_runtime_task.sh
          ! grep -q 'run_20260823_171233_30513' tools/runtime_task.sh
