name: G8 Runtime Task Contract

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  ALFA_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  g8-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.ALFA_SOURCE_COMMIT }}
          fetch-depth: 2
      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ALFA_SOURCE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "${GITHUB_REF}" = refs/heads/master
            test "${GITHUB_SHA}" = "$ALFA_SOURCE_COMMIT"
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            test "${GITHUB_BASE_REF}" = master
            test "${{ github.event.pull_request.head.sha }}" = "$ALFA_SOURCE_COMMIT"
          fi
          echo "EXPECTED_SOURCE_COMMIT=$ALFA_SOURCE_COMMIT"
          echo "ACTUAL_HEAD=$(git rev-parse HEAD)"
          echo "ACTUAL_TREE=$(git rev-parse HEAD^{tree})"
          echo "SOURCE_STATUS=$(git status --porcelain=v1 --untracked-files=all)"
          echo EXACT_SOURCE_IDENTITY=PASS
      - name: Bash syntax
        shell: bash
        run: |
          bash -n tools/gate8_runtime_task.sh
          bash -n tools/runtime_task.sh
          bash -n tools/test_gate8_contract.sh
      - name: G8 contract test
        shell: bash
        run: bash tools/test_gate8_contract.sh
      - name: Protected gate source boundary
        shell: bash
        run: |
          changed=$(git diff-tree --no-commit-id --name-only -r HEAD^ HEAD)
          for path in $changed; do
            case "$path" in
              tools/gate7_runtime_session.sh)
                grep -Fq 'is_supported_runtime' tools/gate7_runtime_session.sh
                ! grep -Fq "session runtime_id is not the Debian acceptance runtime" tools/gate7_runtime_session.sh
                echo "G7_MULTIDISTRO_MIGRATION_ALLOWED=$path"
                ;;
              tools/gate1_foundation_v2.sh)
                grep -Fq 'expected = ["debian", "ubuntu", "alpine", "kali"]' tools/gate1_foundation_v2.sh
                grep -Fq 'acceptance_status") != "SUPPORTED"' tools/gate1_foundation_v2.sh
                grep -Fq 'acceptance_order=debian>ubuntu>alpine>kali' tools/gate1_foundation_v2.sh
                echo "G1_MULTIDISTRO_MIGRATION_ALLOWED=$path"
                ;;
              tools/runtime_bootstrap.sh)
                grep -Fq 'RUNTIME_ID=${2:-}' tools/runtime_bootstrap.sh
                grep -Fq 'runtime_registry_sha256=' tools/runtime_bootstrap.sh
                grep -Fq 'runtime_id=$RUNTIME_ID' tools/runtime_bootstrap.sh
                echo "G6_RUNTIME_BINDING_ALLOWED=$path"
                ;;
              tools/gate2_*|tools/execution_capability.sh|tools/gate3_*|tools/environment_contract.sh|tools/gate5_*)
                echo "PROTECTED_SOURCE_CHANGED=$path"
                exit 1
                ;;
            esac
          done
          echo 'G1_G7_SOURCE_BOUNDARY=PASS'
      - name: No propagation fallback
        shell: bash
        run: |
          ! grep -q 'runtime_stage.sh' tools/gate8_runtime_task.sh
          ! grep -q 'runtime_stage.sh' tools/runtime_task.sh
          ! grep -q 'run_20260823_171233_30513' tools/gate8_runtime_task.sh
          ! grep -q 'run_20260823_171233_30513' tools/runtime_task.sh
