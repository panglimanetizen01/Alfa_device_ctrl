name: G12 Runtime Kernel Contract
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  ALFA_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  g12:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.ALFA_SOURCE_COMMIT }}
          fetch-depth: 0
      - name: Verify source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ALFA_SOURCE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "${GITHUB_REF}" = refs/heads/master
            test "${GITHUB_SHA}" = "$ALFA_SOURCE_COMMIT"
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            test "${GITHUB_BASE_REF}" = master
            test "${{ github.event.pull_request.head.sha }}" = "$ALFA_SOURCE_COMMIT"
          fi
          echo EXACT_SOURCE_IDENTITY=PASS
      - name: Bash syntax
        run: |
          bash -n tools/gate12_runtime_kernel.sh
          bash -n tools/runtime_kernel.sh
          bash -n tools/test_gate12_contract.sh
      - name: G12 contract
        run: bash tools/test_gate12_contract.sh
      - name: G1-G11 protection
        run: |
          test -f tools/gate1_foundation_v2.sh
          test -f tools/gate2_canonical_source_build_boundary.sh
          test -f tools/execution_capability.sh
          test -f tools/gate3_execution_capability.sh
          test -f tools/environment_contract.sh
          test -f tools/gate5_common.sh
          test -f tools/runtime_bootstrap.sh
          test -f tools/gate7_runtime_session.sh
          test -f tools/gate8_runtime_task.sh
          test -f tools/gate9_runtime_action.sh
          test -f tools/gate10_runtime_workflow.sh
          test -f tools/gate11_runtime_orchestrator.sh
