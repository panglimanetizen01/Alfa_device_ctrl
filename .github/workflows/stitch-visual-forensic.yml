name: Stitch Visual Forensic
run-name: Stitch Visual Forensic — ${{ github.sha }}

on:
  push:
    branches: [work/stitch-native-implementation]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-forensic:
    name: Extract representative Stitch screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Extract locked visual targets
        run: |
          set -euo pipefail
          z=stitch/stitch_alfa_device_control_v1.0.0.zip
          test "$(sha256sum "$z" | cut -d' ' -f1)" = '7b3428e474e7c778a11fecf995d417bc1b6d5d9575a879fa9da1e86eb637895d'
          out=stitch-visual-forensic
          rm -rf "$out" stitch-extract
          mkdir -p "$out" stitch-extract
          unzip -q "$z" -d stitch-extract
          for d in \
            alfa_device_ctrl_15_session_multiplexer_ubuntu_kali_alpine_mobile_view \
            alfa_device_ctrl_active_ubuntu_terminal_spawned_session_pts_5 \
            alfa_device_ctrl_add_directory_override_dialog \
            alfa_device_ctrl_alfa_control_center_settings_refined_ui \
            alfa_device_ctrl_appearance_settings_terminal_obsidian_preset_restored \
            alfa_device_ctrl_split_pane_terminal_workspace_refined_ui \
            alfa_device_ctrl_floating_terminal_controls_session_lifecycle \
            alfa_device_ctrl_ubuntu_terminal_sessions_spawned_session_5_pts_4_nmap_tcpdump; do
            src=$(find stitch-extract -type f -path "*/$d/screen.png" -print -quit)
            test -n "$src"
            cp "$src" "$out/$d.png"
          done
          python3 - <<'PY'
          import hashlib, pathlib, struct
          out=pathlib.Path('stitch-visual-forensic')
          for p in sorted(out.glob('*.png')):
              b=p.read_bytes()
              w,h=struct.unpack('>II', b[16:24])
              print(f'{p.name}|{w}x{h}|{len(b)}|{hashlib.sha256(b).hexdigest()}')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: stitch-visual-forensic-${{ github.sha }}
          path: stitch-visual-forensic
