name: Action Pinning Audit

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit workflow action references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path('.github/workflows')
          pattern = re.compile(r'^\s*uses:\s*([^\s#]+)(?:\s+#.*)?$', re.MULTILINE)

          # Regression tests: the parser must inspect immutable SHA refs both with
          # and without an inline version comment, and must reject tag refs.
          parser_cases = {
              'uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v6':
                  'actions/checkout@0123456789abcdef0123456789abcdef01234567',
              'uses: actions/checkout@0123456789abcdef0123456789abcdef01234567':
                  'actions/checkout@0123456789abcdef0123456789abcdef01234567',
          }
          for line, expected in parser_cases.items():
              match = pattern.fullmatch(line)
              assert match is not None, f'parser failed to match: {line}'
              assert match.group(1) == expected, f'parser mismatch: {line}'
          assert pattern.fullmatch('uses: actions/checkout@v6') is not None

          bad = []
          found = []

          for path in sorted(root.glob('*.y*ml')):
              text = path.read_text(encoding='utf-8')
              for match in pattern.finditer(text):
                  ref = match.group(1)
                  found.append((path.as_posix(), ref))
                  if not re.fullmatch(r'[^@]+@[0-9a-fA-F]{40}', ref):
                      bad.append((path.as_posix(), ref))

          print(f'WORKFLOW_ACTION_REFS={len(found)}')
          for path, ref in found:
              print(f'REF {path}: {ref}')

          if bad:
              print('UNPINNED_ACTION_REFS:')
              for path, ref in bad:
                  print(f'  {path}: {ref}')
              print(f'UNPINNED_COUNT={len(bad)}')
              sys.exit(1)

          print('UNPINNED_COUNT=0')
          print('STATUS=PASS')
          PY
