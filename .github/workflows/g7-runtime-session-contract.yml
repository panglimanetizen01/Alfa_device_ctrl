name: G7 Runtime Session Contract

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  ALFA_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  g7-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.ALFA_SOURCE_COMMIT }}
          fetch-depth: 0
      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ALFA_SOURCE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "${GITHUB_REF}" = refs/heads/master
            test "${GITHUB_SHA}" = "$ALFA_SOURCE_COMMIT"
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            test "${GITHUB_BASE_REF}" = master
            test "${{ github.event.pull_request.head.sha }}" = "$ALFA_SOURCE_COMMIT"
          fi
          echo EXACT_SOURCE_IDENTITY=PASS
          git fsck --full --no-progress
      - name: Bash syntax
        shell: bash
        run: |
          bash -n tools/gate7_runtime_session.sh
          bash -n tools/runtime_session.sh
          bash -n tools/test_gate7_contract.sh
      - name: G7 contract and protection test
        shell: bash
        run: bash tools/test_gate7_contract.sh
      - name: JNI boundary assertions
        shell: bash
        run: |
          grep -q 'ReleaseStringUTFChars(env, cwd, cmd_cwd)' terminal-emulator/src/main/jni/termux.c
          ! grep -q 'ReleaseStringUTFChars(env, cmd, cmd_cwd)' terminal-emulator/src/main/jni/termux.c
          ! grep -q 'runtime_stage.sh' tools/runtime_session.sh
