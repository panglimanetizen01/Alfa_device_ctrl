name: UI-13 Android Instrumentation

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - "test/ui-session-ownership-red2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-13-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-13:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '8.11.1'

      - name: Prepare Android SDK and KVM
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;28.0.13004108" "system-images;android-35;google;x86_64"
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check

      - name: Run UI-13 on managed Android device
        shell: bash
        run: |
          set +e
          ./gradlew :app:alfaApi35DebugAndroidTest --no-daemon --stacktrace \
            -Pandroid.testInstrumentationRunnerArguments.class=com.alfa.device_ctrl.Ui13DutVisualInteractionTest
          STATUS=$?
          mkdir -p ci-evidence/ui-13
          printf 'gate=UI-13\nstatus=%s\nsource_commit=%s\nrunner=Gradle Managed Device\ndevice=Pixel 2\napi=35\ntest_class=com.alfa.device_ctrl.Ui13DutVisualInteractionTest\n' \
            "$([ "$STATUS" -eq 0 ] && echo PASS || echo FAIL)" "$(git rev-parse HEAD)" > ci-evidence/ui-13/result.txt
          find app/build/outputs -type f -path '*androidTest-results*' -print 2>/dev/null | head -200 > ci-evidence/ui-13/results-files.txt || true
          find app/build/reports -type f -print 2>/dev/null | head -200 > ci-evidence/ui-13/report-files.txt || true
          exit "$STATUS"

      - name: Upload UI-13 evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: alfa-ui-13-evidence-${{ github.sha }}
          path: |
            ci-evidence/ui-13/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 30
