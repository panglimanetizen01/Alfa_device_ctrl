name: Debian Runtime Profile

on:
  push:
    branches: [master]
    paths:
      - 'app/src/main/java/com/alfa/device_ctrl/RuntimeProfile.java'
      - 'tools/test_debian_rootfs_contract.sh'
      - '.github/workflows/debian-runtime-profile.yml'
  pull_request:
    branches: [master]
    paths:
      - 'app/src/main/java/com/alfa/device_ctrl/RuntimeProfile.java'
      - 'tools/test_debian_rootfs_contract.sh'
      - '.github/workflows/debian-runtime-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify Debian rootfs artifact
        shell: bash
        run: bash tools/test_debian_rootfs_contract.sh
