name: G14 Runtime Command Validation Contract

on:
  push:
    branches: [master]
    paths:
      - 'tools/gate14_runtime_command_validation.sh'
      - 'tools/test_gate14_contract.sh'
      - 'tools/runtime_stage.sh'
      - 'docs/GATE_14_SPEC_V1.md'
      - 'docs/GATE_14_RESULT_SCHEMA_V1.md'
      - '.github/workflows/g14-runtime-command-validation-contract.yml'
  pull_request:
    paths:
      - 'tools/gate14_runtime_command_validation.sh'
      - 'tools/test_gate14_contract.sh'
      - 'tools/runtime_stage.sh'
      - 'docs/GATE_14_SPEC_V1.md'
      - 'docs/GATE_14_RESULT_SCHEMA_V1.md'
      - '.github/workflows/g14-runtime-command-validation-contract.yml'
  workflow_dispatch:

jobs:
  g14-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify source identity
        shell: bash
        run: |
          set -u
          EXPECTED='${{ github.sha }}'
          ACTUAL=$(git rev-parse HEAD)
          test "$EXPECTED" = "$ACTUAL"
          git fsck --full --no-progress

      - name: Verify G1-G13 protection surface
        shell: bash
        run: |
          set -u
          for p in \
            tools/gate1_foundation_v2.sh \
            tools/gate2_canonical_source_build_boundary.sh \
            tools/execution_capability.sh \
            tools/gate3_execution_capability.sh \
            tools/environment_contract.sh \
            tools/gate5_common.sh \
            tools/runtime_bootstrap.sh \
            tools/gate7_runtime_session.sh \
            tools/gate8_runtime_task.sh \
            tools/gate9_runtime_action.sh \
            tools/gate10_runtime_workflow.sh \
            tools/gate11_runtime_orchestrator.sh \
            tools/gate12_runtime_kernel.sh \
            tools/gate13_runtime_command_request.sh \
            tools/test_gate13_contract.sh; do
            test -f "$p"
          done
          echo G1_G13_PROTECTION=PASS

      - name: Verify legacy G14 path is not authoritative
        shell: bash
        run: |
          set -u
          ! grep -Fq "gate14)" tools/runtime_stage.sh
          grep -Fq 'G14 is intentionally not implemented here' tools/runtime_stage.sh
          echo LEGACY_G14_PROPAGATION=REMOVED

      - name: Run G14 contract test
        shell: bash
        run: |
          set -u
          bash tools/test_gate14_contract.sh

      - name: Validate G14 schema and execution boundary
        shell: bash
        run: |
          set -u
          grep -Fqx 'schema_version=gate14-runtime-command-validation.v1' docs/GATE_14_RESULT_SCHEMA_V1.md
          grep -Fq 'validation_status=ALLOWED' tools/gate14_runtime_command_validation.sh
          grep -Fq 'execution_status=DEFERRED' tools/gate14_runtime_command_validation.sh
          grep -Fq 'execution_authority=G17' tools/gate14_runtime_command_validation.sh
          ! grep -Eq 'runtime_stage\\.sh|runtime_execution\\.sh|/bin/sh[[:space:]]+-c|[[:space:]]eval[[:space:]]' tools/gate14_runtime_command_validation.sh
          ! grep -Eq 'command_result=|command_returncode=|execution_result=|guest_stdout=|guest_stderr=' tools/gate14_runtime_command_validation.sh
          echo G14_SCHEMA_BOUNDARY=PASS
