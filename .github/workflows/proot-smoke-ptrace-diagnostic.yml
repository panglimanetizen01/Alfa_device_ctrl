name: PRoot smoke ptrace diagnostic

on:
  push:
    branches: [work/g2-four-session-lifecycle]
    paths:
      - 'app/src/androidTest/java/com/alfa/device_ctrl/RuntimeSmokePtraceDiagnosticTest.java'
      - 'app/src/main/java/com/alfa/device_ctrl/RuntimeInstaller.java'
      - 'app/src/main/java/com/alfa/device_ctrl/RuntimeRegistry.java'
      - 'app/build.gradle'
      - 'terminal-view/**'
      - 'runtime/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_dispatch:

env:
  ALFA_SOURCE_COMMIT: ${{ github.sha }}
  ALFA_GATE7_RUNTIME_ID: debian

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo EXACT_SOURCE_IDENTITY=PASS
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '8.11.1'
      - name: Prepare Android SDK and NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" platform-tools 'platforms;android-36' 'build-tools;36.0.0' emulator 'system-images;android-35;google_apis;x86_64' 'ndk;28.0.13004108'
          test -x "$ANDROID_HOME/ndk/28.0.13004108/ndk-build"
          printf '%s\n' "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/emulator" "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Prepare canonical Gate 7 launch provenance
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/alfa-ci-shared" "$RUNNER_TEMP/alfa-ci-private"
          export ALFA_EXEC_SHARED_ROOT="$RUNNER_TEMP/alfa-ci-shared"
          export TMPDIR="$RUNNER_TEMP/alfa-ci-private"
          OUT="$RUNNER_TEMP/runtime-pipeline.out"
          bash tools/runtime_pipeline.sh > "$OUT" 2>&1
          cat "$OUT"
          RUN_ID="$(sed -n 's/^pipeline_run_id=//p' "$OUT" | sed -n '1p')"
          test -n "$RUN_ID"
          RUN_DIR="artifacts/pipeline/$RUN_ID"
          test -s "$RUN_DIR/gate4/environment_contract.txt"
          test "$(sed -n 's/^source_commit=//p' "$RUN_DIR/gate4/environment_contract.txt" | sed -n '1p')" = "$ALFA_SOURCE_COMMIT"
          bash tools/apk_readiness_provenance.sh "$RUN_ID" "$ALFA_GATE7_RUNTIME_ID" g2-ptrace-diagnostic
          test -s "$RUN_DIR/gate6/bootstrap.txt"
          grep -Fx 'gate_status=PASS' "$RUN_DIR/gate6/bootstrap.txt"
          grep -Fx 'bootstrap_status=PASS' "$RUN_DIR/gate6/bootstrap.txt"
          grep -Fx 'authorization_status=AUTHORIZED' "$RUN_DIR/gate6/bootstrap.txt"
          OUT7="$RUNNER_TEMP/gate7-launch.properties"
          ALFA_GATE7_ASSET_OUT="$OUT7" RUNTIME_ID="$ALFA_GATE7_RUNTIME_ID" bash tools/prepare_gate7_android_asset.sh "$RUN_ID"
          test -s "$OUT7"
          grep -Fx 'schema_version=gate7-launch.v1' "$OUT7"
          grep -Fx 'gate_status=READY' "$OUT7"
          grep -Fx 'launch_status=AUTHORIZED' "$OUT7"
          grep -Fx "pipeline_run_id=$RUN_ID" "$OUT7"
          grep -Fx "source_commit=$ALFA_SOURCE_COMMIT" "$OUT7"
          echo "ALFA_GATE7_ASSET=$OUT7" >> "$GITHUB_ENV"
          echo "ALFA_PIPELINE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo CURRENT_RUN_GATE7=PASS
      - name: Enable KVM hardware acceleration
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm4all"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm
          echo KVM_READY=PASS
      - name: Create and start emulator
        run: |
          set -euo pipefail
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user-home"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          avdmanager create avd --force --name g2-diag --package 'system-images;android-35;google_apis;x86_64' --device 'pixel_2' </dev/null
          emulator -avd g2-diag -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          for i in $(seq 1 120); do
            adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1$' && break
            sleep 2
          done
          adb shell getprop sys.boot_completed | tr -d '\r' | grep -q '^1$'
          adb shell getprop ro.product.cpu.abi
          adb shell getprop ro.product.cpu.abilist
      - name: Build and install exact diagnostic APKs
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
          adb uninstall com.alfa.device_ctrl >/dev/null 2>&1 || true
          adb install app/build/outputs/apk/debug/app-debug.apk
          adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER com.alfa.device_ctrl | tail -n 1
      - name: Run ptrace diagnostic
        run: |
          set -euo pipefail
          adb logcat -c
          adb shell am instrument -w -r -e class com.alfa.device_ctrl.RuntimeSmokePtraceDiagnosticTest com.alfa.device_ctrl.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/instrumentation.txt"
      - name: Collect diagnostic evidence
        if: always()
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/evidence"
          adb shell run-as com.alfa.device_ctrl.test sh -c 'find "$HOME" -maxdepth 4 -type f -name "g2-proot-ptrace-diagnostic.txt" -o -name "g2-proot-verbose.log"' > "$RUNNER_TEMP/evidence/files.txt" 2>&1 || true
          adb shell run-as com.alfa.device_ctrl.test sh -c 'cat "$HOME/files/g2-proot-ptrace-diagnostic.txt" 2>/dev/null || true; cat "$HOME/g2-proot-ptrace-diagnostic.txt" 2>/dev/null || true' > "$RUNNER_TEMP/evidence/ptrace-diagnostic.txt" 2>&1 || true
          adb shell run-as com.alfa.device_ctrl.test sh -c 'cat "$HOME/files/g2-proot-verbose.log" 2>/dev/null || true; cat "$HOME/g2-proot-verbose.log" 2>/dev/null || true' > "$RUNNER_TEMP/evidence/proot-verbose.log" 2>&1 || true
          adb shell getprop ro.product.cpu.abi > "$RUNNER_TEMP/evidence/device-abi.txt" 2>&1 || true
          adb shell getprop ro.product.cpu.abilist > "$RUNNER_TEMP/evidence/device-abilist.txt" 2>&1 || true
          adb shell dumpsys package com.alfa.device_ctrl > "$RUNNER_TEMP/evidence/package.txt" 2>&1 || true
          adb logcat -d -b all -v threadtime > "$RUNNER_TEMP/evidence/logcat.txt" 2>&1 || true
          cp "$RUNNER_TEMP/instrumentation.txt" "$RUNNER_TEMP/evidence/instrumentation.txt" 2>/dev/null || true
          cp "$RUNNER_TEMP/emulator.log" "$RUNNER_TEMP/evidence/emulator.log" 2>/dev/null || true
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proot-smoke-ptrace-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 7
