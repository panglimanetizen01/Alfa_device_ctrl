name: Alfa G2 Canonical Source Build Boundary

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "${GITHUB_REF}" = refs/heads/master
          fi

      - name: Run G1 prerequisite
        shell: bash
        run: |
          set -euo pipefail
          bash tools/gate1_foundation_v2.sh
          test "$(sed -n 's/^gate_status=//p' artifacts/gates/g1/foundation-contract.txt)" = GREEN
          test "$(sed -n 's/^source_commit=//p' artifacts/gates/g1/foundation-contract.txt)" = "${GITHUB_SHA}"

      - name: Negative stale-source test
        shell: bash
        run: |
          set -euo pipefail
          if G2_EXPECT_SOURCE_COMMIT=0000000000000000000000000000000000000000 bash tools/gate2_canonical_source_build_boundary.sh >/dev/null 2>&1; then
            echo 'stale-source-negative-test=FAIL'
            exit 1
          fi
          echo 'stale-source-negative-test=PASS'

      - name: Run G2 contract tests
        shell: bash
        run: |
          set -euo pipefail
          bash tools/test_gate2_contract.sh

      - name: Run G2 canonical boundary on canonical master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          bash tools/gate2_canonical_source_build_boundary.sh
          test "$(sed -n 's/^gate_status=//p' artifacts/gates/g2/canonical-source-build-boundary.txt)" = GREEN
          test "$(sed -n 's/^source_commit=//p' artifacts/gates/g2/canonical-source-build-boundary.txt)" = "${GITHUB_SHA}"

      - name: Verify PR does not substitute merge ref for canonical master
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_BASE_REF}" = master
          echo G2_PR_CANONICAL_MASTER_UNTOUCHED=PASS

      - name: Upload G2 evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: alfa-g2-canonical-source-build-boundary-${{ github.sha }}
          path: artifacts/gates/g2/canonical-source-build-boundary.txt
          if-no-files-found: error
