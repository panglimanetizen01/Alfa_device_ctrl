name: B1 Runtime Registry Artifact Provenance
run-name: B1 Runtime Registry Artifact Provenance — ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows:
      - Alfa APK Readiness
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Source JSON = APK asset = Gate7 SHA
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALFA_SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
      ALFA_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Checkout exact build commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download exact APK artifact from triggering run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: alfa-device-ctrl-stitch-${{ env.ALFA_SOURCE_COMMIT }}
          path: ${{ runner.temp }}/b1-artifact
          run-id: ${{ env.ALFA_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify same commit, same APK, and three-way registry SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ALFA_SOURCE_COMMIT"

          mapfile -t APKS < <(find "$RUNNER_TEMP/b1-artifact" -type f -name '*.apk' | sort)
          mapfile -t MANIFESTS < <(find "$RUNNER_TEMP/b1-artifact" -type f -name 'apk-artifact-provenance.txt' | sort)
          test "${#APKS[@]}" -eq 1
          test "${#MANIFESTS[@]}" -eq 1

          APK="${APKS[0]}"
          MANIFEST="${MANIFESTS[0]}"
          test "$(sed -n 's/^source_commit=//p' "$MANIFEST")" = "$ALFA_SOURCE_COMMIT"
          EXPECTED_APK_SHA="$(sed -n 's/^apk_sha256=//p' "$MANIFEST")"
          ACTUAL_APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          test "$EXPECTED_APK_SHA" = "$ACTUAL_APK_SHA"

          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          unzip -p "$APK" assets/runtimes.v1.json > "$TMP/runtimes.v1.json"
          unzip -p "$APK" assets/gate7-launch.properties > "$TMP/gate7-launch.properties"
          test -s "$TMP/runtimes.v1.json"
          test -s "$TMP/gate7-launch.properties"

          SOURCE_SHA="$(sha256sum runtime/runtimes.v1.json | awk '{print $1}')"
          APK_SHA="$(sha256sum "$TMP/runtimes.v1.json" | awk '{print $1}')"
          test "$(grep -c '^runtime_registry_sha256=' "$TMP/gate7-launch.properties")" = 1
          GATE7_SHA="$(awk -F= '$1=="runtime_registry_sha256" {print $2; exit}' "$TMP/gate7-launch.properties")"
          printf '%s\n' "$GATE7_SHA" | grep -Eq '^[0-9a-fA-F]{64}$'

          echo "B1_PROVENANCE_COMMIT_SHA=$ALFA_SOURCE_COMMIT"
          echo "B1_PROVENANCE_WORKFLOW_RUN_ID=$ALFA_RUN_ID"
          echo "B1_PROVENANCE_APK_PATH=$APK"
          echo "B1_PROVENANCE_APK_SHA256=$ACTUAL_APK_SHA"
          echo "B1_PROVENANCE_SOURCE_SHA256=$SOURCE_SHA"
          echo "B1_PROVENANCE_PACKAGED_ASSET_SHA256=$APK_SHA"
          echo "B1_PROVENANCE_GATE7_RUNTIME_REGISTRY_SHA256=$GATE7_SHA"

          test "$SOURCE_SHA" = "$APK_SHA"
          test "$APK_SHA" = "$GATE7_SHA"
          test "$SOURCE_SHA" = "$GATE7_SHA"
          echo "B1_RUNTIME_REGISTRY_APK_PROVENANCE=PASS"
