name: g15-runtime-command-policy-contract

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  g15-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify source identity
        shell: bash
        run: |
          set -u
          EXPECTED="$(git rev-parse HEAD)"
          ACTUAL="${GITHUB_SHA}"
          test "$EXPECTED" = "$ACTUAL"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "${GITHUB_REF}" = refs/heads/master
          fi
          git fsck --full --no-progress

      - name: Verify G1-G14 protection surface
        shell: bash
        run: |
          set -u
          for p in \
            tools/gate1_foundation_v2.sh \
            tools/gate2_canonical_source_build_boundary.sh \
            tools/execution_capability.sh \
            tools/gate3_execution_capability.sh \
            tools/environment_contract.sh \
            tools/gate5_common.sh \
            tools/runtime_bootstrap.sh \
            tools/gate7_runtime_session.sh \
            tools/gate8_runtime_task.sh \
            tools/gate9_runtime_action.sh \
            tools/gate10_runtime_workflow.sh \
            tools/gate11_runtime_orchestrator.sh \
            tools/gate12_runtime_kernel.sh \
            tools/gate13_runtime_command_request.sh \
            tools/gate14_runtime_command_validation.sh \
            tools/test_gate14_contract.sh; do
            test -f "$p"
          done
          echo G1_G14_PROTECTION=PASS

      - name: Verify legacy G15 path is not authoritative
        shell: bash
        run: |
          set -u
          ! grep -Fq 'gate15)' tools/runtime_stage.sh
          grep -Fq 'G15 is intentionally not implemented here' tools/runtime_stage.sh
          echo LEGACY_G15_PROPAGATION=REMOVED

      - name: Run G15 contract test
        shell: bash
        run: |
          set -u
          bash tools/test_gate15_contract.sh

      - name: Validate G15 schema and execution boundary
        shell: bash
        run: |
          set -u
          grep -Fq 'schema_version=gate15-runtime-command-policy.v1' docs/GATE_15_RESULT_SCHEMA_V1.md
          grep -Fq 'policy_status=ALLOWED|BLOCKED' docs/GATE_15_RESULT_SCHEMA_V1.md
          grep -Fq 'execution_status=DEFERRED' tools/gate15_runtime_command_policy.sh
          grep -Fq 'execution_authority=G17' tools/gate15_runtime_command_policy.sh
          ! grep -Eq 'runtime_stage\\.sh|runtime_execution\\.sh|/bin/sh[[:space:]]+-c|[[:space:]]eval[[:space:]]' tools/gate15_runtime_command_policy.sh
          ! grep -Eq 'command_result=|command_returncode=|guest_stdout=|guest_stderr=' tools/gate15_runtime_command_policy.sh
          echo G15_SCHEMA_BOUNDARY=PASS
