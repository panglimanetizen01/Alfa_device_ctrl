name: Alfa APK Readiness

on:
  push:
    branches:
      - master
      - fix/apk-runtime-readiness-e2e
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Parser and runner smoke test
        run: |
          set -euo pipefail
          echo "APK_READINESS_WORKFLOW_PARSED=PASS"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_REF=$GITHUB_REF"
