name: Alfa APK Readiness
run-name: APK Readiness — ${{ github.sha }}

on:
  push:
    branches:
      - master
      - fix/sterile-stitch-apk-boundary
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  apk-readiness:
    name: Canonical → APK → Runtime-ready artifact
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ALFA_SOURCE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      ALFA_GATE7_RUNTIME_ID: debian
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify canonical source identity
        run: |
          set -euo pipefail
          printf '%s' "$ALFA_SOURCE_COMMIT" | grep -Eq '^[0-9a-fA-F]{40}$'
          test "$ALFA_SOURCE_COMMIT" = "$(git rev-parse HEAD)"
          test "$ALFA_GATE7_RUNTIME_ID" = "debian"
          git fsck --full --no-progress
          echo "CANONICAL_SOURCE_COMMIT=$(git rev-parse HEAD)"

      - name: Verify canonical APK producer policy
        run: |
          set -euo pipefail
          bash tools/tests/test_canonical_apk_provenance_contract.sh

      - name: Diagnose Debug Keystore Secret Boundary
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, os, re
          raw = os.environb.get(b"DEBUG_KEYSTORE_BASE64", b"")
          print(f"SECRET_PRESENT={'YES' if raw else 'NO'}")
          print(f"SECRET_BYTES={len(raw)}")
          print(f"SECRET_SHA256={hashlib.sha256(raw).hexdigest()}")
          print(f"CR_BYTES={raw.count(b"\\r")}")
          print(f"LF_BYTES={raw.count(b"\\n")}")
          print(f"NON_BASE64_BYTES={len(re.sub(rb"[A-Za-z0-9+/=]", b"", raw))}")
          print(f"LENGTH_MOD_4={len(raw) % 4}")
          print(f"FIRST_PADDING_OFFSET={raw.find(b"=")}")
          try:
              decoded = base64.b64decode(raw, validate=True)
              print("STRICT_BASE64_DECODE=PASS")
              print(f"DECODED_BYTES={len(decoded)}")
              print(f"DECODED_SHA256={hashlib.sha256(decoded).hexdigest()}")
          except Exception as exc:
              print("STRICT_BASE64_DECODE=FAIL")
              print(f"STRICT_BASE64_ERROR={type(exc).__name__}")
          PY

      - name: TDD source UI boundary contract
        run: |
          set -euo pipefail
          bash tools/tests/test_stitch_ui_boundary.sh

      - name: Verify explicit legacy UI blacklist in source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          blacklist = [x for x in Path('tools/ci/stitch-legacy-ui-blacklist.txt').read_text('utf-8').splitlines() if x and not x.startswith('#')]
          if not blacklist or any('*' in x or '?' in x for x in blacklist):
              raise SystemExit('INVALID_EXPLICIT_BLACKLIST')
          excluded = {Path('tools/ci/stitch-legacy-ui-blacklist.txt'), Path('stitch/stitch_alfa_device_control_v1.0.0.zip')}
          extensions = {'.java','.kt','.xml','.json','.properties','.txt','.md','.gradle','.groovy','.sh','.py'}
          hits=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p in excluded or p.suffix.lower() not in extensions:
                  continue
              try: text=p.read_text('utf-8')
              except UnicodeDecodeError: continue
              for literal in blacklist:
                  if literal in text: hits.append((str(p),literal))
          if hits:
              for p,l in hits: print(f'SOURCE_LEGACY_UI_RESIDUE file={p} literal={l}')
              raise SystemExit('SOURCE_LEGACY_UI_RESIDUE=FAIL')
          print('SOURCE_LEGACY_UI_RESIDUE=ZERO')
          PY

      - name: Forensic clean stale APK build outputs
        run: |
          set -euo pipefail
          tracked_generated="$(git ls-files -z | tr '\0' '\n' | grep -E '(^|/)(build|\.build|\.gradle)(/|$)|\.apk$|\.aab$|\.apks$|\.xapk$' || true)"
          if [ -n "$tracked_generated" ]; then
            echo "TRACKED_GENERATED_BUILD_ARTIFACTS_FOUND"
            printf '%s\n' "$tracked_generated"
            exit 1
          fi
          rm -rf .gradle .build build app/build terminal-emulator/build terminal-view/build app/src/main/jniLibs/arm64-v8a/libtermux.so
          if find . -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.apks' -o -name '*.xapk' \) -print -quit | grep -q .; then
            echo "STALE_APK_ARTIFACT_REMAINS_AFTER_CLEAN"
            find . -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.apks' -o -name '*.xapk' \) -print
            exit 1
          fi
          echo "STALE_APK_BUILD_OUTPUTS=REMOVED"
          echo "SOURCE_TREE_BUILD_ARTIFACT_BOUNDARY=PASS"

      - name: Setup Java and Gradle for provenance probes
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle for provenance probes
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '8.11.1'

      - name: Configure CI capability roots
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/alfa-ci-shared" "$RUNNER_TEMP/alfa-ci-private"
          echo "ALFA_EXEC_SHARED_ROOT=$RUNNER_TEMP/alfa-ci-shared" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/alfa-ci-private" >> "$GITHUB_ENV"

      - name: Generate current-run Gate 4 pipeline evidence
        shell: bash {0}
        run: |
          set -u
          OUT="$RUNNER_TEMP/alfa-runtime-pipeline.out"
          bash tools/runtime_pipeline.sh > "$OUT" 2>&1
          RC=$?
          cat "$OUT"
          echo "RUNTIME_PIPELINE_RC=$RC"
          [ "$RC" -eq 0 ] || exit "$RC"
          RUN_ID="$(sed -n 's/^pipeline_run_id=//p' "$OUT" | sed -n '1p')"
          [ -n "$RUN_ID" ]
          RUN_DIR="artifacts/pipeline/$RUN_ID"
          test -s "$RUN_DIR/gate4/environment_contract.txt"
          test "$(sed -n 's/^source_commit=//p' "$RUN_DIR/gate4/environment_contract.txt" | sed -n '1p')" = "$ALFA_SOURCE_COMMIT"
          echo "ALFA_PIPELINE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "ALFA_PIPELINE_RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"
          echo "CURRENT_RUN_GATE4=PASS"

      - name: Generate current-run production Gate 5 and Gate 6 provenance
        run: |
          set -euo pipefail
          bash tools/apk_readiness_provenance.sh "$ALFA_PIPELINE_RUN_ID" "$ALFA_GATE7_RUNTIME_ID" apk-readiness
          GATE6="$ALFA_PIPELINE_RUN_DIR/gate6/bootstrap.txt"
          test -s "$GATE6"
          grep -Fx 'gate_status=PASS' "$GATE6"
          grep -Fx 'bootstrap_status=PASS' "$GATE6"
          grep -Fx 'authorization_status=AUTHORIZED' "$GATE6"
          grep -Fx "source_commit=$ALFA_SOURCE_COMMIT" "$GATE6"
          grep -Fx "runtime_id=$ALFA_GATE7_RUNTIME_ID" "$GATE6"
          echo "CURRENT_RUN_GATE5_GATE6=PASS"

      - name: Prepare exact Gate 7 Android launch asset
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/gate7-launch.properties"
          ALFA_GATE7_ASSET_OUT="$OUT" RUNTIME_ID="$ALFA_GATE7_RUNTIME_ID" bash tools/prepare_gate7_android_asset.sh "$ALFA_PIPELINE_RUN_ID"
          test -s "$OUT"
          grep -Fx 'schema_version=gate7-launch.v1' "$OUT"
          grep -Fx 'gate_status=READY' "$OUT"
          grep -Fx 'launch_status=AUTHORIZED' "$OUT"
          grep -Fx "pipeline_run_id=$ALFA_PIPELINE_RUN_ID" "$OUT"
          grep -Fx "source_commit=$ALFA_SOURCE_COMMIT" "$OUT"
          grep -Fx "runtime_id=$ALFA_GATE7_RUNTIME_ID" "$OUT"
          echo "ALFA_GATE7_ASSET=$OUT" >> "$GITHUB_ENV"
          echo "CURRENT_RUN_GATE7=PASS"

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "ndk;28.0.13004108"

      - name: Rebuild libtermux from canonical source
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/28.0.13004108"
          "$NDK/ndk-build" -C terminal-emulator NDK_PROJECT_PATH="$GITHUB_WORKSPACE/terminal-emulator" APP_BUILD_SCRIPT="$GITHUB_WORKSPACE/terminal-emulator/src/main/jni/Android.mk" APP_ABI=arm64-v8a NDK_OUT="$RUNNER_TEMP/termux-obj" NDK_LIBS_OUT="$GITHUB_WORKSPACE/terminal-emulator/src/main/jniLibs" V=1
          LIB="terminal-emulator/src/main/jniLibs/arm64-v8a/libtermux.so"
          test -s "$LIB"
          READELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$READELF" -h "$LIB" | grep -E 'Class:.*ELF64|Machine:.*AArch64|Type:.*DYN'
          mapfile -t LOAD_ALIGNS < <("$READELF" -lW "$LIB" | awk '$1 == "LOAD" {print $NF}')
          test "${#LOAD_ALIGNS[@]}" -gt 0
          for align in "${LOAD_ALIGNS[@]}"; do
            echo "LIBTERMUX_LOAD_ALIGN=$align"
            ALIGN_DEC=$(printf '%s\n' "$align" | awk '{if ($1 ~ /^0x/) printf "%d", strtonum($1); else printf "%d", $1}')
            test "$ALIGN_DEC" -ge 16384
          done
          echo "LIBTERMUX_SHA256=$(sha256sum "$LIB" | awk '{print $1}')"

      - name: Unit tests and sterile APK build
        run: |
          set -euo pipefail
          test -s "$ALFA_GATE7_ASSET"
          test "$ALFA_GATE7_RUNTIME_ID" = "debian"
          ./gradlew clean test :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify final APK launcher manifest
        run: |
          set -euo pipefail
          bash tools/tests/test_stitch_launcher_apk.sh app/build/outputs/apk/debug/app-debug.apk "$ANDROID_HOME/build-tools/35.0.0/aapt2"

      - name: Verify final UI to terminal execution contract
        run: |
          set -euo pipefail
          grep -Fq 'AlfaUiTheme.apply(activity)' app/src/main/java/com/alfa/device_ctrl/AlfaApplication.java
          grep -Fq 'mRenderer = new TerminalRenderer(14, Typeface.MONOSPACE)' terminal-view/src/main/java/com/termux/view/TerminalView.java
          grep -Fq 'new TerminalSession(' app/src/main/java/com/alfa/device_ctrl/RuntimeSessionManager.java
          grep -Fq 'SessionUiState.resolve(event).name()' app/src/main/java/com/alfa/device_ctrl/RuntimeSessionManager.java
          grep -Fq 'RuntimeStartupCoordinator.onActivityResumed(activity)' app/src/main/java/com/alfa/device_ctrl/AlfaApplication.java
          grep -Fq 'RuntimeStartupPolicy.shouldAutoStart' app/src/main/java/com/alfa/device_ctrl/RuntimeStartupCoordinator.java
          ! grep -Fq 'AlfaFinalUiPresentation.apply(activity)' app/src/main/java/com/alfa/device_ctrl/AlfaApplication.java
          echo "FINAL_UI_TO_TERMINAL_EXECUTION_CONTRACT=PASS"

      - name: Deep-scan APK against explicit legacy blacklist and Stitch UI contract
        run: |
          set -euo pipefail
          bash tools/ci/verify_stitch_apk.sh app/build/outputs/apk/debug/app-debug.apk tools/ci/stitch-legacy-ui-blacklist.txt

      - name: Verify packaged runtime startup contract and provenance
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -F 'assets/gate7-launch.properties'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libproot-loader.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libproot.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libtermux.so'
          TMP=$(mktemp -d); trap 'rm -rf "$TMP"' EXIT
          unzip -p "$APK" assets/gate7-launch.properties > "$TMP/gate7-launch.properties"
          diff -u "$ALFA_GATE7_ASSET" "$TMP/gate7-launch.properties"
          grep -Fx "source_commit=$ALFA_SOURCE_COMMIT" "$TMP/gate7-launch.properties"
          grep -Fx "pipeline_run_id=$ALFA_PIPELINE_RUN_ID" "$TMP/gate7-launch.properties"
          grep -Fx 'launch_status=AUTHORIZED' "$TMP/gate7-launch.properties"
          echo "PACKAGED_RUNTIME_STARTUP_AND_PROVENANCE=PASS"

      - name: Verify native ELF and 16 KB APK alignment
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          TMP=$(mktemp -d); trap 'rm -rf "$TMP"' EXIT
          unzip -q "$APK" 'lib/**/*.so' -d "$TMP"
          READELF="$ANDROID_HOME/ndk/28.0.13004108/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          mapfile -t LIBS < <(find "$TMP/lib" -type f -name '*.so' | sort)
          test "${#LIBS[@]}" -gt 0
          for so in "${LIBS[@]}"; do
            echo "ELF_CHECK=$so"
            "$READELF" -h "$so" | grep -E 'Class:.*ELF64|Machine:.*AArch64|Type:'
            TYPE=$("$READELF" -h "$so" | awk '$1 == "Type:" {print $2}')
            case "$TYPE" in
              DYN|EXEC)
                mapfile -t LOAD_ALIGNS < <("$READELF" -lW "$so" | awk '$1 == "LOAD" {print $NF}')
                test "${#LOAD_ALIGNS[@]}" -gt 0
                for align in "${LOAD_ALIGNS[@]}"; do
                  echo "ELF_LOAD_ALIGN=$align"
                  ALIGN_DEC=$(printf '%s\n' "$align" | awk '{if ($1 ~ /^0x/) printf "%d", strtonum($1); else printf "%d", $1}')
                  test "$ALIGN_DEC" -ge 16384
                done
                if [ "$TYPE" = "DYN" ]; then
                  RELRO=$("$READELF" -lW "$so" | awk '$1 == "GNU_RELRO" {print $1; exit}')
                  test "$RELRO" = "GNU_RELRO"
                  echo "ELF_RELRO=PASS"
                else
                  echo "ELF_RELRO=NOT_APPLICABLE_EXECUTABLE"
                fi
                ;;
              *) echo "UNEXPECTED_ELF_TYPE=$TYPE"; exit 1 ;;
            esac
          done
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          echo "APK_NATIVE_ELF_ALIGNMENT_PASS=16KB"
          echo "APK_ZIP_ALIGNMENT_PASS=16KB"

      - name: Package exactly one canonical APK and provenance manifest
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          FINAL="$ALFA_PIPELINE_RUN_DIR/alfa-device-ctrl-stitch-${ALFA_SOURCE_COMMIT}.apk"
          cp "$APK" "$FINAL"
          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          STITCH_SHA256=$(sha256sum stitch/stitch_alfa_device_control_v1.0.0.zip | awk '{print $1}')
          BLACKLIST_SHA256=$(sha256sum tools/ci/stitch-legacy-ui-blacklist.txt | awk '{print $1}')
          cat > "$ALFA_PIPELINE_RUN_DIR/apk-artifact-provenance.txt" <<EOF
          schema_version=apk-artifact-provenance.v2
          artifact_name=alfa-device-ctrl-stitch-${ALFA_SOURCE_COMMIT}.apk
          apk_path=alfa-device-ctrl-stitch-${ALFA_SOURCE_COMMIT}.apk
          apk_sha256=$APK_SHA256
          source_commit=$ALFA_SOURCE_COMMIT
          pipeline_run_id=$ALFA_PIPELINE_RUN_ID
          stitch_reference=stitch/stitch_alfa_device_control_v1.0.0.zip
          stitch_reference_sha256=$STITCH_SHA256
          legacy_ui_blacklist=tools/ci/stitch-legacy-ui-blacklist.txt
          legacy_ui_blacklist_sha256=$BLACKLIST_SHA256
          package_name=com.alfa.device_ctrl
          version_code=1
          version_name=0.1.0
          abi=arm64-v8a
          build_variant=debug-deployable
          workflow=${GITHUB_WORKFLOW}
          workflow_file=.github/workflows/apk-readiness.yml
          workflow_sha=${GITHUB_WORKFLOW_SHA}
          workflow_run_id=${GITHUB_RUN_ID}
          build_command=./gradlew clean test :app:assembleDebug --no-daemon --stacktrace
          java_version=21
          gradle_version=8.11.1
          android_platform=android-36
          android_build_tools=35.0.0
          ndk_version=28.0.13004108
          artifact_policy=ONE_APK_PLUS_ONE_PROVENANCE_MANIFEST
          EOF
          test "$(find "$ALFA_PIPELINE_RUN_DIR" -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1
          test "$(find "$ALFA_PIPELINE_RUN_DIR" -maxdepth 1 -type f -name 'apk-artifact-provenance.txt' | wc -l)" -eq 1
          echo "CANONICAL_APK_SHA256=$APK_SHA256"
          echo "CANONICAL_ARTIFACT_SHAPE=ONE_APK_PLUS_ONE_MANIFEST"

      - name: Upload only canonical APK and provenance manifest
        id: canonical_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alfa-device-ctrl-stitch-${{ env.ALFA_SOURCE_COMMIT }}
          path: |
            artifacts/pipeline/${{ env.ALFA_PIPELINE_RUN_ID }}/alfa-device-ctrl-stitch-${{ env.ALFA_SOURCE_COMMIT }}.apk
            artifacts/pipeline/${{ env.ALFA_PIPELINE_RUN_ID }}/apk-artifact-provenance.txt
          if-no-files-found: error
          retention-days: 14

      - name: Record external artifact identity
        run: |
          set -euo pipefail
          {
            echo "### Canonical APK artifact binding"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "workflow_file=.github/workflows/apk-readiness.yml"
            echo "workflow_sha=$GITHUB_WORKFLOW_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "artifact_id=${{ steps.canonical_upload.outputs.artifact-id }}"
            echo "artifact_name=alfa-device-ctrl-stitch-${ALFA_SOURCE_COMMIT}"
            echo "artifact_digest=${{ steps.canonical_upload.outputs.artifact-digest }}"
          } >> "$GITHUB_STEP_SUMMARY"

  independent-artifact-verification:
    name: Independent post-upload artifact verification
    needs: apk-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verifier scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Download only the uploaded deployment artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: alfa-device-ctrl-stitch-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: artifact

      - name: Verify artifact contains exactly one APK and one provenance manifest
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find artifact -type f -name '*.apk' | sort)
          mapfile -t MANIFESTS < <(find artifact -type f -name 'apk-artifact-provenance.txt' | sort)
          test "${#APKS[@]}" -eq 1
          test "${#MANIFESTS[@]}" -eq 1
          find artifact -type f ! -name '*.apk' ! -name 'apk-artifact-provenance.txt' -print -quit | grep -q . && exit 1 || true
          APK="${APKS[0]}"
          MANIFEST="${MANIFESTS[0]}"
          EXPECTED=$(sed -n 's/^apk_sha256=//p' "$MANIFEST")
          ACTUAL=$(sha256sum "$APK" | awk '{print $1}')
          test "$EXPECTED" = "$ACTUAL"
          grep -Fx 'artifact_policy=ONE_APK_PLUS_ONE_PROVENANCE_MANIFEST' "$MANIFEST"
          grep -Fx 'schema_version=apk-artifact-provenance.v2' "$MANIFEST"
          echo "POST_UPLOAD_SHA256_MATCH=PASS"
          echo "POST_UPLOAD_ARTIFACT_SHAPE=PASS"

      - name: Verify launcher manifest in uploaded APK
        run: |
          set -euo pipefail
          bash tools/tests/test_stitch_launcher_apk.sh "$(find artifact -type f -name '*.apk' -print -quit)" "$ANDROID_HOME/build-tools/35.0.0/aapt2"

      - name: Run offline binary forensic verifier
        run: |
          set -euo pipefail
          bash tools/ci/verify_stitch_apk.sh "$(find "$GITHUB_WORKSPACE/artifact" -type f -name '*.apk' -print -quit)" tools/ci/stitch-legacy-ui-blacklist.txt
