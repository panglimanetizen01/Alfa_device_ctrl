name: Forensic APK Build

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - fix/apk-terminal-ui-runtime-chain-20260912
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify canonical source identity
        run: |
          set -euo pipefail
          test "$SOURCE_COMMIT" = "$(git rev-parse HEAD)"
          git fsck --full --no-progress
          echo "CANONICAL_SOURCE_COMMIT=$(git rev-parse HEAD)"

      - name: Clean stale generated build state
        run: |
          set -euo pipefail
          test -z "$(git ls-files | grep -E '(^|/)(build|\.gradle)(/|$)|\.apk$' || true)"
          rm -rf .gradle .build build app/build terminal-emulator/build terminal-view/build
          test -z "$(find . -type f -name '*.apk' -print -quit)"

      - name: Setup Java and Gradle
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '8.11.1'

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "ndk;28.0.13004108"

      - name: Rebuild canonical native dependency
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/28.0.13004108"
          "$NDK/ndk-build" -C terminal-emulator NDK_PROJECT_PATH="$GITHUB_WORKSPACE/terminal-emulator" APP_BUILD_SCRIPT="$GITHUB_WORKSPACE/terminal-emulator/src/main/jni/Android.mk" APP_ABI=arm64-v8a NDK_OUT="$RUNNER_TEMP/termux-obj" NDK_LIBS_OUT="$GITHUB_WORKSPACE/terminal-emulator/src/main/jniLibs" V=1
          test -s terminal-emulator/src/main/jniLibs/arm64-v8a/libtermux.so

      - name: Unit tests and exact APK build
        run: |
          set -euo pipefail
          ./gradlew clean test :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK identity, native payload and alignment
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libproot-loader.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libproot.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libtermux.so'
          unzip -l "$APK" | grep -F 'assets/gate7-launch.properties'
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump packagename "$APK" | grep -Fx 'com.alfa.device_ctrl'
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -E "versionCode='1'|versionName='0.1.0'"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          printf 'schema_version=forensic-apk-provenance.v1\nsource_commit=%s\napk_sha256=%s\npackage_name=com.alfa.device_ctrl\nabi=arm64-v8a\n' "$SOURCE_COMMIT" "$SHA" > forensic-apk-provenance.txt
          cat forensic-apk-provenance.txt

      - name: Upload exact APK and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forensic-alfa-device-ctrl-${{ env.SOURCE_COMMIT }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            forensic-apk-provenance.txt
          if-no-files-found: error
          retention-days: 14
