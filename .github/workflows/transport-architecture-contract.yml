name: Transport Architecture Contract

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  transport-contract:
    name: Embedded PTY/PRoot transport contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Prove canonical transport boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -R -E 'import com\.termux\.terminal\.TerminalSession|import com\.termux\.view\.TerminalView' app/src/main/java/com/alfa/device_ctrl >/dev/null
          grep -R 'RuntimeSessionManager' app/src/main/java/com/alfa/device_ctrl/StitchOperationalActivityV2.java >/dev/null
          grep -R 'ShizukuExecutionBridge' app/src/main/java/com/alfa/device_ctrl >/dev/null
          grep -R 'TermuxRunCommandBridge' app/src/main/java/com/alfa/device_ctrl >/dev/null
          grep -R 'TermuxApiCapabilityBridge' app/src/main/java/com/alfa/device_ctrl >/dev/null
          grep -R 'ShizukuProvider' app/src/main/AndroidManifest.xml >/dev/null
          grep -R 'com.termux.permission.RUN_COMMAND' app/src/main/AndroidManifest.xml >/dev/null
          printf '%s\n' \
            'TRANSPORT_ARCHITECTURE=APP→RuntimeSessionManager→TerminalSession→embedded PTY→PRoot→rootfs' \
            'EXTERNAL_TRANSPORT=Shizuku + Termux RUN_COMMAND' \
            'TERMUX_API=ACTIVE_CAPABILITY_LANE' \
            'SHIZUKU_RISH=ACTIVE_EXTERNAL_LANE'
