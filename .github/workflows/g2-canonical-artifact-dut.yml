name: Canonical APK DUT Execution\n\non:\n  push:\n    branches: [master]\n    paths:\n      - '.github/workflows/g2-canonical-artifact-dut.yml'\n\npermissions:\n  contents: read\n  actions: read\n\njobs:\n  dut:\n    name: Execute canonical APK on Android DUT\n    runs-on: ubuntu-latest\n    timeout-minutes: 45\n    env:\n      SOURCE_COMMIT: 97a1e5a8e3ce5d2de63508af0c57de2dd0873117\n      PRODUCER_RUN_ID: '35300121723'\n      PRODUCER_ARTIFACT_ID: '10530345563'\n      EXPECTED_APK_SHA256: 2659ac40da7fd2b3c7d497872538180102a965a1f611490d724cffb36d1a5745\n      PACKAGE: com.alfa.device_ctrl\n      INSTRUMENTATION: com.alfa.device_ctrl.test/androidx.test.runner.AndroidJUnitRunner\n\n    steps:\n      - name: Checkout exact producer source\n        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6\n        with:\n          fetch-depth: 0\n          ref: ${{ env.SOURCE_COMMIT }}\n\n      - name: Verify source identity\n        run: |\n          set -euo pipefail\n          test "$SOURCE_COMMIT" = "$(git rev-parse HEAD)"\n          git fsck --full --no-progress\n          echo "SOURCE_COMMIT_VERIFIED=$SOURCE_COMMIT"\n\n      - name: Download exact canonical artifact\n        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4\n        with:\n          name: alfa-device-ctrl-stitch-97a1e5a8e3ce5d2de63508af0c57de2dd0873117\n          path: deployment\n          run-id: ${{ env.PRODUCER_RUN_ID }}\n          github-token: ${{ secrets.GITHUB_TOKEN }}\n\n      - name: Verify canonical artifact identity\n        run: |\n          set -euo pipefail\n          APK="$(find deployment -type f -name '*.apk' -print -quit)"\n          MANIFEST="$(find deployment -type f -name 'apk-artifact-provenance.txt' -print -quit)"\n          test -n "$APK"; test -n "$MANIFEST"\n          test "$(sha256sum "$APK" | awk '{print $1}')" = "$EXPECTED_APK_SHA256"\n          grep -Fx "apk_sha256=$EXPECTED_APK_SHA256" "$MANIFEST"\n          grep -Fx "source_commit=$SOURCE_COMMIT" "$MANIFEST"\n          echo "ARTIFACT_ID=$PRODUCER_ARTIFACT_ID"\n          echo "APK_SHA256_VERIFIED=$EXPECTED_APK_SHA256"\n          echo "PROVENANCE_VERIFIED=PASS"\n          echo "CANONICAL_APK=$APK" >> "$GITHUB_ENV"\n\n      - name: Prepare Android SDK and x86_64 AVD\n        run: |\n          set -euo pipefail\n          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"\n          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"\n          "$SDKMANAGER" "platform-tools" "emulator" "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;google_apis;x86_64"\n          echo no | "$AVDMANAGER" create avd -n alfa-canonical-api35 -k "system-images;android-35;google_apis;x86_64" -d "pixel_2" --force\n          test -s "$HOME/.android/avd/alfa-canonical-api35.avd/config.ini"\n          echo "AVD_CREATED=PASS"\n\n      - name: Boot Android DUT and prove ADB readiness\n        run: |\n          set -euo pipefail\n          nohup "$ANDROID_HOME/emulator/emulator" -avd alfa-canonical-api35 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/alfa-emulator.log" 2>&1 &\n          adb wait-for-device\n          timeout 180 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q "1"; do sleep 2; done'\n          test "$(adb shell get-state | tr -d "\r")" = device\n          echo "BOOT_COMPLETED=PASS"\n          adb shell getprop ro.product.cpu.abi\n          adb shell getprop ro.build.version.sdk\n\n      - name: Build only Android instrumentation APK\n        run: |\n          set -euo pipefail\n          ./gradlew :app:assembleDebugAndroidTest --no-daemon --stacktrace\n          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk\n\n      - name: Install exact production APK and instrumentation\n        run: |\n          set -euo pipefail\n          adb install -r "$CANONICAL_APK"\n          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk\n          adb shell pm path "$PACKAGE"\n          adb shell pm list packages | grep -Fx "package:$PACKAGE"\n          echo "EXACT_APK_INSTALL=PASS"\n          echo "PACKAGE_PRESENT=PASS"\n\n      - name: Verify installed APK SHA\n        run: |\n          set -euo pipefail\n          INSTALLED_PATH="$(adb shell pm path "$PACKAGE" | tr -d "\r" | sed -n 's/^package://p' | head -1)"\n          test -n "$INSTALLED_PATH"\n          adb pull "$INSTALLED_PATH" "$RUNNER_TEMP/installed.apk" >/dev/null\n          test "$(sha256sum "$RUNNER_TEMP/installed.apk" | awk '{print $1}')" = "$EXPECTED_APK_SHA256"\n          echo "INSTALLED_APK_SHA256_VERIFIED=$EXPECTED_APK_SHA256"\n\n      - name: Prove application process\n        run: |\n          set -euo pipefail\n          adb shell am start -W -n "$PACKAGE/.StitchOperationalActivityV2"\n          timeout 30 bash -c 'until adb shell pidof "$PACKAGE" | tr -d "\r" | grep -Eq "^[0-9]+( [0-9]+)*$"; do sleep 1; done'\n          PID="$(adb shell pidof "$PACKAGE" | tr -d "\r")"\n          test -n "$PID"\n          echo "APP_PROCESS_STARTED=PASS"\n          echo "APP_PID=$PID"\n\n      - name: Run canonical fresh-start terminal instrumentation\n        run: |\n          set -o pipefail\n          CLASS='com.alfa.device_ctrl.AlfaStartupTerminalE2ETest#freshStartupReachesTerminalPromptAndExecutesPwd'\n          adb shell am instrument -w -r -e class "$CLASS" -e expected_apk_sha256 "$EXPECTED_APK_SHA256" "$INSTRUMENTATION" 2>&1 | tee "$RUNNER_TEMP/instrumentation.txt"\n\n      - name: Capture retained DUT evidence\n        if: always()\n        run: |\n          set +e\n          mkdir -p "$RUNNER_TEMP/dut-evidence"\n          adb shell get-state > "$RUNNER_TEMP/dut-evidence/adb-state.txt" 2>&1\n          adb shell pm path "$PACKAGE" > "$RUNNER_TEMP/dut-evidence/package-path.txt" 2>&1\n          adb shell pidof "$PACKAGE" > "$RUNNER_TEMP/dut-evidence/app-pid.txt" 2>&1\n          adb shell dumpsys package "$PACKAGE" > "$RUNNER_TEMP/dut-evidence/package-dumpsys.txt" 2>&1\n          adb shell pm list instrumentation > "$RUNNER_TEMP/dut-evidence/instrumentation-list.txt" 2>&1\n          adb logcat -d > "$RUNNER_TEMP/dut-evidence/logcat.txt" 2>&1\n          cp "$RUNNER_TEMP/alfa-emulator.log" "$RUNNER_TEMP/dut-evidence/emulator.log" 2>/dev/null || true\n          cp "$RUNNER_TEMP/instrumentation.txt" "$RUNNER_TEMP/dut-evidence/instrumentation.txt" 2>/dev/null || true\n          printf 'source_commit=%s\nproducer_run_id=%s\nproducer_artifact_id=%s\nexpected_apk_sha256=%s\n' "$SOURCE_COMMIT" "$PRODUCER_RUN_ID" "$PRODUCER_ARTIFACT_ID" "$EXPECTED_APK_SHA256" > "$RUNNER_TEMP/dut-evidence/provenance.txt"\n\n      - name: Upload retained DUT evidence\n        if: always()\n        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2\n        with:\n          name: canonical-apk-dut-evidence-${{ github.sha }}\n          path: ${{ runner.temp }}/dut-evidence\n          if-no-files-found: error\n          retention-days: 14