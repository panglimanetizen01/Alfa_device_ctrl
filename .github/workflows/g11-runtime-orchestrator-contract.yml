name: G11 Runtime Orchestrator Contract
on:
  push:
    branches: [master]
    paths:
      - 'tools/gate11_runtime_orchestrator.sh'
      - 'tools/runtime_orchestrator.sh'
      - 'tools/test_gate11_contract.sh'
      - 'docs/GATE_11_*'
      - '.github/workflows/g11-runtime-orchestrator-contract.yml'
  pull_request:
    branches: [master]
    paths:
      - 'tools/gate11_runtime_orchestrator.sh'
      - 'tools/runtime_orchestrator.sh'
      - 'tools/test_gate11_contract.sh'
      - 'docs/GATE_11_*'
      - '.github/workflows/g11-runtime-orchestrator-contract.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          bash -n tools/gate11_runtime_orchestrator.sh
          bash -n tools/runtime_orchestrator.sh
          bash -n tools/test_gate11_contract.sh
      - name: Run G11 contract
        shell: bash
        run: bash tools/test_gate11_contract.sh
