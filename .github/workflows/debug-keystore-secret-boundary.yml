name: Debug Keystore Secret Boundary Forensic
run-name: Debug Keystore Secret Boundary Forensic — ${{ github.sha }}

on:
  push:
    branches:
      - fix/sterile-stitch-apk-boundary
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-secret-boundary:
    name: Diagnose Debug Keystore Secret Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Diagnose Debug Keystore Secret Boundary
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import math
          import os
          import re

          raw = os.environb.get(b"DEBUG_KEYSTORE_BASE64", b"")
          allowed = re.compile(rb"[A-Za-z0-9+/=]")

          print(f"SECRET_PRESENT={'YES' if raw else 'NO'}")
          print(f"SECRET_BYTES={len(raw)}")
          print(f"SECRET_SHA256={hashlib.sha256(raw).hexdigest()}")
          print(f"CR_BYTES={raw.count(b'\\r')}")
          print(f"LF_BYTES={raw.count(b'\\n')}")
          print(f"NON_BASE64_BYTES={sum(1 for byte in raw if not allowed.fullmatch(bytes([byte])))}")
          print(f"LENGTH_MOD_4={len(raw) % 4}")
          print(f"FIRST_PADDING_OFFSET={raw.find(b'=')}")

          try:
              decoded = base64.b64decode(raw, validate=True)
              print("STRICT_BASE64_DECODE=PASS")
              print(f"DECODED_BYTES={len(decoded)}")
              print(f"DECODED_SHA256={hashlib.sha256(decoded).hexdigest()}")
          except Exception as exc:
              print("STRICT_BASE64_DECODE=FAIL")
              print(f"STRICT_BASE64_ERROR={type(exc).__name__}")

          if len(raw) == 0:
              raise SystemExit("SECRET_EMPTY")

          print(
              "SEGMENT_ALIGNMENT="
              + ("ALIGNED_TO_4" if len(raw) % 4 == 0 else "NOT_ALIGNED_TO_4")
          )

          segment_count = 16
          segment_size = max(4, math.ceil(len(raw) / segment_count / 4) * 4)
          print(f"SEGMENT_COUNT_TARGET={segment_count}")
          print(f"SEGMENT_SIZE={segment_size}")

          invalid_offsets = [
              index
              for index, byte in enumerate(raw)
              if not allowed.fullmatch(bytes([byte]))
          ]

          def ranges(offsets):
              if not offsets:
                  return "NONE"
              out = []
              start = prev = offsets[0]
              for offset in offsets[1:]:
                  if offset == prev + 1:
                      prev = offset
                      continue
                  out.append(f"{start}-{prev}")
                  start = prev = offset
              out.append(f"{start}-{prev}")
              return ",".join(out)

          print(
              "INVALID_BYTE_OFFSETS="
              + (",".join(map(str, invalid_offsets)) if invalid_offsets else "NONE")
          )
          print(f"INVALID_BYTE_RANGES={ranges(invalid_offsets)}")

          segment_index = 0
          offset = 0
          while offset < len(raw):
              end = min(offset + segment_size, len(raw))
              segment = raw[offset:end]
              segment_invalid = [
                  offset + local
                  for local, byte in enumerate(segment)
                  if not allowed.fullmatch(bytes([byte]))
              ]
              try:
                  base64.b64decode(segment, validate=True)
                  strict = "PASS"
              except Exception:
                  strict = "FAIL"
              print(
                  f"SEGMENT[{segment_index:02d}] "
                  f"OFFSET={offset}..{end - 1} "
                  f"LEN={len(segment)} "
                  f"NON_BASE64={len(segment_invalid)} "
                  f"STRICT_BASE64_DECODE={strict}"
              )
              if segment_invalid:
                  print(
                      f"SEGMENT[{segment_index:02d}]_INVALID_RANGES="
                      f"{ranges(segment_invalid)}"
                  )
              segment_index += 1
              offset = end

          print(f"FORENSIC_SEGMENTS_TOTAL={segment_index}")
          print("FORENSIC_SECRET_VALUE_OUTPUT=ZERO")
          PY
