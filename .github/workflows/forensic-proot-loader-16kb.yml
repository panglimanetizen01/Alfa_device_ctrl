name: Alfa Forensic PRoot Loader 16K

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proot-loader-16kb-forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install NDK r28
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'ndk;28.0.13004108'"
      - name: Build canonical PRoot loader and capture ELF evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/loader-out"
          PROOT_LOADER_OUT="$RUNNER_TEMP/loader-out/libproot-loader.so" bash tools/build_proot_loader.sh
          LOADER="$RUNNER_TEMP/loader-out/libproot-loader.so"
          READELF="$ANDROID_HOME/ndk/28.0.13004108/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          echo '=== LOADER PROGRAM HEADERS ==='
          "$READELF" -lW "$LOADER"
          echo '=== LOADER SHA256 ==='
          sha256sum "$LOADER"
