name: G10 Runtime Workflow Contract

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  ALFA_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  g10-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.ALFA_SOURCE_COMMIT }}
          fetch-depth: 0
      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ALFA_SOURCE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "${GITHUB_REF}" = refs/heads/master
            test "${GITHUB_SHA}" = "$ALFA_SOURCE_COMMIT"
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            test "${GITHUB_BASE_REF}" = master
            test "${{ github.event.pull_request.head.sha }}" = "$ALFA_SOURCE_COMMIT"
          fi
          echo EXACT_SOURCE_IDENTITY=PASS
      - name: Bash syntax
        run: |
          bash -n tools/gate10_runtime_workflow.sh
          bash -n tools/runtime_workflow.sh
          bash -n tools/test_gate10_contract.sh
      - name: G10 contract and protection test
        run: bash tools/test_gate10_contract.sh
      - name: G1-G9 source protection
        run: |
          git diff --name-only HEAD^ HEAD > /tmp/g10-changed.txt
          while IFS= read -r path; do
            case "$path" in
              tools/gate7_runtime_session.sh)
                grep -Fq 'is_supported_runtime' tools/gate7_runtime_session.sh
                ! grep -Fq "session runtime_id is not the Debian acceptance runtime" tools/gate7_runtime_session.sh
                ;;
              tools/gate1_foundation_v2.sh)
                grep -Fq 'expected = ["debian", "ubuntu", "alpine", "kali"]' tools/gate1_foundation_v2.sh
                grep -Fq 'acceptance_status") != "SUPPORTED"' tools/gate1_foundation_v2.sh
                grep -Fq 'acceptance_order=debian>ubuntu>alpine>kali' tools/gate1_foundation_v2.sh
                ;;
              .github/workflows/g8-runtime-task-contract.yml|.github/workflows/g9-runtime-action-contract.yml)
                grep -Fq 'G7_MULTIDISTRO_MIGRATION_ALLOWED' .github/workflows/g8-runtime-task-contract.yml .github/workflows/g9-runtime-action-contract.yml
                grep -Fq 'G1_MULTIDISTRO_MIGRATION_ALLOWED' .github/workflows/g8-runtime-task-contract.yml .github/workflows/g9-runtime-action-contract.yml
                ;;
              tools/runtime_bootstrap.sh)
                grep -Fq 'RUNTIME_ID=${2:-}' tools/runtime_bootstrap.sh
                grep -Fq 'runtime_registry_sha256=' tools/runtime_bootstrap.sh
                grep -Fq 'runtime_id=$RUNTIME_ID' tools/runtime_bootstrap.sh
                ;;
              tools/gate2_canonical_source_build_boundary.sh|tools/execution_capability.sh|tools/gate3_execution_capability.sh|tools/environment_contract.sh|tools/gate5_common.sh|tools/gate8_runtime_task.sh|tools/gate9_runtime_action.sh)
                echo "PROTECTED_SOURCE_CHANGED=$path"
                exit 1
                ;;
            esac
          done < /tmp/g10-changed.txt
          echo 'G1_G9_SOURCE_PROTECTION=PASS'
