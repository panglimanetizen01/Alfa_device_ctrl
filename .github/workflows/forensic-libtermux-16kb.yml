name: Alfa Forensic libtermux 16K

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  libtermux-16kb-forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '8.11.1'
      - name: Install NDK r28
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'ndk;28.0.13004108'"
      - name: Build libtermux and capture exact ELF evidence
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/28.0.13004108"
          "$NDK/ndk-build" -C terminal-emulator NDK_PROJECT_PATH="$GITHUB_WORKSPACE/terminal-emulator" APP_BUILD_SCRIPT="$GITHUB_WORKSPACE/terminal-emulator/src/main/jni/Android.mk" APP_ABI=arm64-v8a NDK_OUT="$RUNNER_TEMP/termux-obj" NDK_LIBS_OUT="$GITHUB_WORKSPACE/terminal-emulator/src/main/jniLibs" V=1
          LIB=terminal-emulator/src/main/jniLibs/arm64-v8a/libtermux.so
          READELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          echo '=== ANDROID.MK ==='
          cat terminal-emulator/src/main/jni/Android.mk
          echo '=== ELF HEADER ==='
          "$READELF" -h "$LIB"
          echo '=== ELF PROGRAM HEADERS ==='
          "$READELF" -lW "$LIB"
          echo '=== LLVM VERSION ==='
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version
          echo '=== LIBTERMUX SHA256 ==='
          sha256sum "$LIB"
