name: Alfa CI

on:
  push:
    branches:
      - master
      - review/gate-sync
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alfa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"
          printf 'SOURCE_SHA=%s\n' "$(git rev-parse HEAD)"

      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '8.11.1'

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "ndk;28.0.13004108"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"

      - name: Prepare canonical PRoot loader
        run: |
          set -euo pipefail
          ./gradlew :app:prepareProotLoader --no-daemon --stacktrace
          test -x app/build/generated/jniLibs/arm64-v8a/libproot-loader.so
          "$ANDROID_HOME/ndk/28.0.13004108/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h app/build/generated/jniLibs/arm64-v8a/libproot-loader.so | grep -E 'Class:|Machine:'

      - name: Unit tests
        run: |
          set -euo pipefail
          ./gradlew test --no-daemon --stacktrace

      - name: Assemble debug APK
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK native payload and 16 KB alignment
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          unzip -q "$APK" 'lib/**/*.so' -d "$TMP"
          READELF="$ANDROID_HOME/ndk/28.0.13004108/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          mapfile -t LIBS < <(find "$TMP/lib" -type f -name '*.so' | sort)
          test "${#LIBS[@]}" -gt 0
          for so in "${LIBS[@]}"; do
            "$READELF" -lW "$so" | awk '$1 == "LOAD" {if ($NF != "0x4000") bad=1} END {if (NR == 0 || bad) exit 1}'
            "$READELF" -lW "$so" | grep -q 'GNU_RELRO'
          done
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          sha256sum "$APK"

      - name: Verify manifest identity
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump packagename "$APK" | grep -Fx 'com.alfa.device_ctrl'
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -E "versionCode='1'|versionName='0.1.0'"

      - name: Publish APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alfa-device-ctrl-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
