name: Alfa Forensic Gate7 APK Layout

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  gate7-apk-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ALFA_SOURCE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      ALFA_GATE7_RUNTIME_ID: debian
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '8.11.1'
      - name: Prepare Gate7 asset and SDK
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/gate7-launch.properties"
          bash tools/runtime_pipeline.sh >/dev/null
          RUN_ID=$(find artifacts/pipeline -mindepth 1 -maxdepth 1 -type d -name 'run_*' | sort | tail -n1 | xargs -n1 basename)
          ALFA_GATE7_ASSET_OUT="$OUT" RUNTIME_ID="$ALFA_GATE7_RUNTIME_ID" bash tools/prepare_gate7_android_asset.sh "$RUN_ID"
          echo "ALFA_GATE7_ASSET=$OUT" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "ndk;28.0.13004108"
      - name: Build exact Gate7 APK
        run: |
          set -euo pipefail
          ./gradlew clean test :app:assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Capture ZIP layout and alignment diagnostics
        shell: bash {0}
        run: |
          set -u
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo '=== APK ZIP LIST (all uncompressed entries) ==='
          unzip -lv "$APK" | awk '$2 == "Stored" {print}' || true
          echo '=== GATE7 ENTRY ==='
          unzip -lv "$APK" | grep -F 'assets/gate7-launch.properties' || true
          echo '=== NATIVE ENTRIES ==='
          unzip -lv "$APK" | grep 'lib/arm64-v8a/.*\.so' || true
          echo '=== ZIP TEST ==='
          unzip -t "$APK"
          echo '=== ZIPALIGN 4K CHECK ==='
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          RC4=$?
          echo "ZIPALIGN_4K_RC=$RC4"
          echo '=== ZIPALIGN 16K CHECK ==='
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          RC16=$?
          echo "ZIPALIGN_16K_RC=$RC16"
          exit 0
      - name: Upload exact APK for forensic inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forensic-gate7-apk-layout-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
