name: UI Batch Verification

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '8.11.1'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.13004108"
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Debug APK compile
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
