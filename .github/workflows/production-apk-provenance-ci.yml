name: Production APK Provenance CI

on:
  push:
    branches:
      - work/production-transport-bridges-20260918
  workflow_dispatch:

jobs:
  produce-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact producer source
        uses: actions/checkout@v4
        with:
          ref: 97ea316ecc260d821941c9fe8555ee7cdad1e6b6
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve and validate sdkmanager launcher
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ -x "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          else
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          SDKMANAGER="$(realpath "$SDKMANAGER")"
          test -x "$SDKMANAGER"
          echo "ALFA_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ALFA_SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Verify sdkmanager
        run: |
          set -euo pipefail
          "$ALFA_SDKMANAGER" --sdk_root="$ALFA_SDK_ROOT" --version
          "$ALFA_SDKMANAGER" --sdk_root="$ALFA_SDK_ROOT" --list

      - name: Install NDK 28.0.13004108 required by existing PRoot loader contract
        run: |
          set -euo pipefail
          set +e
          yes | "$ALFA_SDKMANAGER" --sdk_root="$ALFA_SDK_ROOT" --licenses >/dev/null
          status="${PIPESTATUS[1]}"
          set -e
          test "$status" -eq 0
          "$ALFA_SDKMANAGER" --sdk_root="$ALFA_SDK_ROOT" --install "ndk;28.0.13004108"

      - name: Verify NDK
        run: |
          set -euo pipefail
          test -x "$ALFA_SDK_ROOT/ndk/28.0.13004108/ndk-build"

      - name: Clean test
        run: ./gradlew clean test --no-daemon

      - name: Assemble production APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Verify APK exists and create provenance
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          ACTUAL_SOURCE="$(git rev-parse HEAD)"
          test "$ACTUAL_SOURCE" = "97ea316ecc260d821941c9fe8555ee7cdad1e6b6"
          {
            printf 'source_commit=%s\n' "$ACTUAL_SOURCE"
            printf 'producer_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'apk_path=%s\n' "$APK"
            printf 'apk_sha256=%s\n' "$SHA"
          } | tee production-provenance.txt
          cp "$APK" production-app-debug.apk
          sha256sum production-app-debug.apk | tee production-app-debug.apk.sha256
          sha256sum production-provenance.txt | tee production-provenance.txt.sha256

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-apk-provenance-${{ github.run_id }}
          path: |
            production-app-debug.apk
            production-app-debug.apk.sha256
            production-provenance.txt
            production-provenance.txt.sha256
          if-no-files-found: error
