name: G2 Four-Session Lifecycle Instrumentation

# Restored real emulator lane. This is the existing G2 acceptance path: clean-install the candidate APK, provision the canonical runtime through the app, then execute the four-session lifecycle test on a real Android Emulator.

on:
  push:
    branches: [work/g2-four-session-lifecycle]
    paths:
      - 'app/src/main/java/com/alfa/device_ctrl/**'
      - 'app/src/androidTest/**'
      - 'app/src/test/**'
      - 'app/src/main/res/**'
      - 'app/build.gradle'
      - 'terminal-view/**'
      - 'runtime/**'
      - 'tools/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/g2-four-session-lifecycle-instrumentation.yml'
  pull_request:
    paths:
      - 'app/src/main/java/com/alfa/device_ctrl/**'
      - 'app/src/androidTest/**'
      - 'app/src/test/**'
      - 'app/src/main/res/**'
      - 'app/build.gradle'
      - 'terminal-view/**'
      - 'runtime/**'
      - 'tools/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/g2-four-session-lifecycle-instrumentation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ALFA_SOURCE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  ALFA_GATE7_RUNTIME_ID: debian
  GITHUB_EVENT_PULL_REQUEST_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}

jobs:
  g2-instrumentation:
    name: G2 real Android instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.ALFA_SOURCE_COMMIT }}

      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ALFA_SOURCE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            test "${GITHUB_BASE_REF}" = work/stitch-dut-canonical-hardening-v3-ci
            test "${GITHUB_EVENT_PULL_REQUEST_HEAD_SHA}" = "$ALFA_SOURCE_COMMIT"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "${GITHUB_REF}" = refs/heads/work/g2-four-session-lifecycle
            test "${GITHUB_SHA}" = "$ALFA_SOURCE_COMMIT"
          fi
          echo "EXPECTED_SOURCE_COMMIT=$ALFA_SOURCE_COMMIT"
          echo "ACTUAL_HEAD=$(git rev-parse HEAD)"
          echo "ACTUAL_TREE=$(git rev-parse HEAD^{tree})"
          echo EXACT_SOURCE_IDENTITY=PASS

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '8.11.1'

      - name: Pin Android preference and AVD locations
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_USER_HOME="$RUNNER_TEMP/android-user-home"
          ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"

      - name: Prepare Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-35;google_apis;x86_64" "ndk;28.0.13004108"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/emulator/emulator"
          test -x "$ANDROID_HOME/ndk/28.0.13004108/ndk-build"
          printf '%s\n' "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/emulator" "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo ANDROID_SDK_READY=PASS

      - name: Prepare canonical Gate 7 launch provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/alfa-ci-shared" "$RUNNER_TEMP/alfa-ci-private"
          export ALFA_EXEC_SHARED_ROOT="$RUNNER_TEMP/alfa-ci-shared"
          export TMPDIR="$RUNNER_TEMP/alfa-ci-private"
          OUT="$RUNNER_TEMP/runtime-pipeline.out"
          bash tools/runtime_pipeline.sh > "$OUT" 2>&1
          RUN_ID="$(sed -n 's/^pipeline_run_id=//p' "$OUT" | sed -n '1p')"
          test -n "$RUN_ID"
          RUN_DIR="artifacts/pipeline/$RUN_ID"
          test "$(sed -n 's/^source_commit=//p' "$RUN_DIR/gate4/environment_contract.txt" | sed -n '1p')" = "$ALFA_SOURCE_COMMIT"
          bash tools/apk_readiness_provenance.sh "$RUN_ID" "$ALFA_GATE7_RUNTIME_ID" g2-instrumentation
          grep -Fx 'gate_status=PASS' "$RUN_DIR/gate6/bootstrap.txt"
          grep -Fx 'bootstrap_status=PASS' "$RUN_DIR/gate6/bootstrap.txt"
          grep -Fx 'authorization_status=AUTHORIZED' "$RUN_DIR/gate6/bootstrap.txt"
          OUT7="$RUNNER_TEMP/gate7-launch.properties"
          ALFA_GATE7_ASSET_OUT="$OUT7" RUNTIME_ID="$ALFA_GATE7_RUNTIME_ID" bash tools/prepare_gate7_android_asset.sh "$RUN_ID"
          grep -Fx 'schema_version=gate7-launch.v1' "$OUT7"
          grep -Fx 'gate_status=READY' "$OUT7"
          grep -Fx 'launch_status=AUTHORIZED' "$OUT7"
          grep -Fx "source_commit=$ALFA_SOURCE_COMMIT" "$OUT7"
          echo "ALFA_PIPELINE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo CURRENT_RUN_GATE7=PASS

      - name: Enable KVM hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm4all"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          echo KVM_READY=PASS

      - name: Create Android Virtual Device
        shell: bash
        run: |
          set -euo pipefail
          avdmanager list device | grep -F 'id: 18 or "pixel_2"'
          avdmanager create avd --force --name g2-api35 --package 'system-images;android-35;google_apis;x86_64' --device 'pixel_2' </dev/null
          test -f "$ANDROID_AVD_HOME/g2-api35.avd/config.ini"
          emulator -list-avds | grep -Fx g2-api35
          echo AVD_CREATED=PASS

      - name: Start Android Emulator and prove target readiness
        shell: bash
        run: |
          set -euo pipefail
          emulator -avd g2-api35 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > "$RUNNER_TEMP/emulator.log" 2>&1 &
          echo "EMULATOR_PID=$!" >> "$GITHUB_ENV"
          adb wait-for-device
          for i in $(seq 1 120); do
            if adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1$'; then break; fi
            sleep 2
          done
          adb shell getprop sys.boot_completed | tr -d '\r' | grep -q '^1$'
          test "$(adb shell getprop ro.product.cpu.abi | tr -d '\r')" = x86_64
          adb devices
          echo ANDROID_TARGET_READY=PASS

      - name: Build install launch provision and collect native identity
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
          APK=app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s "$APK"; test -s "$TEST_APK"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "APK_SHA256=$APK_SHA256"
          adb uninstall com.alfa.device_ctrl >/dev/null 2>&1 || true
          ! adb shell pm list packages | grep -Fqx 'package:com.alfa.device_ctrl'
          adb install "$APK"
          adb install "$TEST_APK"
          INSTALLED_APK="$(adb shell pm path com.alfa.device_ctrl | sed -n 's/^package://p' | tr -d '\r' | sed -n '1p')"
          test -n "$INSTALLED_APK"
          INSTALLED_SHA256="$(adb shell sha256sum "$INSTALLED_APK" | awk '{print $1}' | tr -d '\r')"
          echo "INSTALLED_APK_SHA256=$INSTALLED_SHA256"
          test "$APK_SHA256" = "$INSTALLED_SHA256"
          echo APK_BYTE_IDENTITY=PASS
          RESOLVED="$(adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER com.alfa.device_ctrl | tr -d '\r' | tail -n 1)"
          test "$RESOLVED" = 'com.alfa.device_ctrl/.StitchOperationalActivity'
          adb logcat -c
          adb logcat -b all -v threadtime > "$RUNNER_TEMP/g2-logcat.txt" 2>&1 &
          LOGCAT_PID=$!
          adb shell am start -W -n com.alfa.device_ctrl/.StitchOperationalActivity
          READY=/data/user/0/com.alfa.device_ctrl/files/runtime-vault/runtimes/debian/READY.evidence
          for i in $(seq 1 180); do
            if adb shell run-as com.alfa.device_ctrl test -f "$READY" 2>/dev/null; then break; fi
            sleep 2
          done
          if ! adb shell run-as com.alfa.device_ctrl test -f "$READY"; then
            adb shell getprop ro.product.cpu.abi
            adb shell getprop ro.product.cpu.abilist
            adb shell run-as com.alfa.device_ctrl sh -c 'find "$HOME" -maxdepth 5 -type f -name "libproot*.so" -print -exec ls -l {} \;' || true
            tail -n 500 "$RUNNER_TEMP/g2-logcat.txt" || true
            exit 1
          fi
          adb shell run-as com.alfa.device_ctrl sh -c "grep -E '^(schema_version|status|runtime_id|engine_source|engine_abi|rootfs_path|engine_sha256|archive_sha256|smoke_contract)=' '$READY'"
          adb shell run-as com.alfa.device_ctrl sh -c "test \"\$(grep '^status=' '$READY' | cut -d= -f2-)\" = READY"
          adb shell run-as com.alfa.device_ctrl sh -c "test \"\$(grep '^runtime_id=' '$READY' | cut -d= -f2-)\" = debian"
          ROOTFS=/data/user/0/com.alfa.device_ctrl/files/runtime-vault/runtimes/debian/rootfs
          adb shell run-as com.alfa.device_ctrl test -f "$ROOTFS/etc/os-release"
          adb shell run-as com.alfa.device_ctrl sh -c "grep -Fx 'ID=debian' '$ROOTFS/etc/os-release'"
          adb shell run-as com.alfa.device_ctrl sh -c 'find "$HOME" -maxdepth 5 -type f -name "libproot*.so" -print'
          kill "$LOGCAT_PID" 2>/dev/null || true
          echo CANONICAL_RUNTIME_PROVISIONING=PASS

      - name: Run G2 four-session lifecycle acceptance
        shell: bash
        run: |
          set -euo pipefail
          adb shell am instrument -w -r -e class com.alfa.device_ctrl.RuntimeKeepAliveFourSessionLifecycleDutTest com.alfa.device_ctrl.test/androidx.test.runner.AndroidJUnitRunner

      - name: Collect G2 evidence
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/g2-evidence"
          adb shell getprop ro.product.cpu.abi > "$RUNNER_TEMP/g2-evidence/device-abi.txt" 2>&1 || true
          adb shell getprop ro.product.cpu.abilist > "$RUNNER_TEMP/g2-evidence/device-abilist.txt" 2>&1 || true
          adb shell dumpsys package com.alfa.device_ctrl > "$RUNNER_TEMP/g2-evidence/package.txt" 2>&1 || true
          adb shell run-as com.alfa.device_ctrl sh -c 'find "$HOME/runtime-vault" -maxdepth 6 -type f -print -exec ls -l {} \;' > "$RUNNER_TEMP/g2-evidence/runtime-vault.txt" 2>&1 || true
          adb shell uiautomator dump /sdcard/g2-window.xml >/dev/null 2>&1 || true
          adb shell cat /sdcard/g2-window.xml > "$RUNNER_TEMP/g2-evidence/ui.xml" 2>&1 || true
          adb exec-out screencap -p > "$RUNNER_TEMP/g2-evidence/g2-screen.png" 2>/dev/null || true
          cp "$RUNNER_TEMP/g2-logcat.txt" "$RUNNER_TEMP/g2-evidence/g2-logcat.txt" 2>/dev/null || true
          cp "$RUNNER_TEMP/emulator.log" "$RUNNER_TEMP/g2-evidence/emulator.log" 2>/dev/null || true

      - name: Upload G2 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g2-four-session-lifecycle-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/g2-evidence
          if-no-files-found: error
          retention-days: 7
