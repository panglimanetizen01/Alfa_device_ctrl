name: G2 Four-Session Lifecycle Instrumentation

# Real emulator lane: clean-install APK, invoke canonical RuntimeInstaller through the app, then run G2 instrumentation.

on:
  push:
    branches: [work/g2-four-session-lifecycle]
    paths:
      - 'app/src/main/java/com/alfa/device_ctrl/**'
      - 'app/src/androidTest/**'
      - 'app/src/test/**'
      - 'app/src/main/res/**'
      - 'app/build.gradle'
      - 'terminal-view/**'
      - 'runtime/**'
      - 'tools/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/g2-four-session-lifecycle-instrumentation.yml'
  pull_request:
    paths:
      - 'app/src/main/java/com/alfa/device_ctrl/**'
      - 'app/src/androidTest/**'
      - 'app/src/test/**'
      - 'app/src/main/res/**'
      - 'app/build.gradle'
      - 'terminal-view/**'
      - 'runtime/**'
      - 'tools/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/g2-four-session-lifecycle-instrumentation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ALFA_SOURCE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  ALFA_GATE7_RUNTIME_ID: debian

jobs:
  g2-instrumentation:
    name: G2 real Android instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.ALFA_SOURCE_COMMIT }}
          fetch-depth: 0

      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ALFA_SOURCE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "${GITHUB_REF}" = refs/heads/work/g2-four-session-lifecycle
            test "${GITHUB_SHA}" = "$ALFA_SOURCE_COMMIT"
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            test "${GITHUB_BASE_REF}" = work/stitch-dut-canonical-hardening-v3-ci
            test "${GITHUB_SHA}" = "$GITHUB_EVENT_PULL_REQUEST_HEAD_SHA"
          fi
          echo "EXPECTED_SOURCE_COMMIT=$ALFA_SOURCE_COMMIT"
          echo "ACTUAL_HEAD=$(git rev-parse HEAD)"
          echo "ACTUAL_TREE=$(git rev-parse HEAD^{tree})"
          echo "SOURCE_STATUS=$(git status --porcelain=v1 --untracked-files=all)"
          echo EXACT_SOURCE_IDENTITY=PASS
          git fsck --full --no-progress
