name: G2 Four-Session Lifecycle Instrumentation

on:
  push:
    branches: [work/g2-four-session-lifecycle]
    paths:
      - 'app/src/main/java/com/alfa/device_ctrl/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle'
      - 'terminal-view/**'
      - 'runtime/**'
      - 'tools/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/g2-four-session-lifecycle-instrumentation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ALFA_SOURCE_COMMIT: ${{ github.sha }}
  ALFA_GATE7_RUNTIME_ID: debian

jobs:
  g2-instrumentation:
    name: G2 real Android instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ env.ALFA_SOURCE_COMMIT }}

      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ALFA_SOURCE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "EXPECTED_SOURCE_COMMIT=$ALFA_SOURCE_COMMIT"
          echo "ACTUAL_HEAD=$(git rev-parse HEAD)"
          echo "ACTUAL_TREE=$(git rev-parse HEAD^{tree})"
          echo EXACT_SOURCE_IDENTITY=PASS

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '8.11.1'

      - name: Prepare Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-35;google_apis;x86_64" "ndk;28.0.13004108"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/emulator/emulator"
          test -x "$ANDROID_HOME/ndk/28.0.13004108/ndk-build"
          printf '%s\n' "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/emulator" "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo ANDROID_SDK_READY=PASS

      - name: Prepare canonical Gate 7 launch provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/alfa-ci-shared" "$RUNNER_TEMP/alfa-ci-private"
          export ALFA_EXEC_SHARED_ROOT="$RUNNER_TEMP/alfa-ci-shared"
          export TMPDIR="$RUNNER_TEMP/alfa-ci-private"
          OUT="$RUNNER_TEMP/runtime-pipeline.out"
          bash tools/runtime_pipeline.sh > "$OUT" 2>&1
          cat "$OUT"
          RUN_ID="$(sed -n 's/^pipeline_run_id=//p' "$OUT" | sed -n '1p')"
          test -n "$RUN_ID"
          RUN_DIR="artifacts/pipeline/$RUN_ID"
          test -s "$RUN_DIR/gate4/environment_contract.txt"
          test "$(sed -n 's/^source_commit=//p' "$RUN_DIR/gate4/environment_contract.txt" | sed -n '1p')" = "$ALFA_SOURCE_COMMIT"
          bash tools/apk_readiness_provenance.sh "$RUN_ID" "$ALFA_GATE7_RUNTIME_ID" g2-instrumentation
          test -s "$RUN_DIR/gate6/bootstrap.txt"
          grep -Fx 'gate_status=PASS' "$RUN_DIR/gate6/bootstrap.txt"
          grep -Fx 'bootstrap_status=PASS' "$RUN_DIR/gate6/bootstrap.txt"
          grep -Fx 'authorization_status=AUTHORIZED' "$RUN_DIR/gate6/bootstrap.txt"
          OUT7="$RUNNER_TEMP/gate7-launch.properties"
          ALFA_GATE7_ASSET_OUT="$OUT7" RUNTIME_ID="$ALFA_GATE7_RUNTIME_ID" bash tools/prepare_gate7_android_asset.sh "$RUN_ID"
          test -s "$OUT7"
          grep -Fx 'schema_version=gate7-launch.v1' "$OUT7"
          grep -Fx 'gate_status=READY' "$OUT7"
          grep -Fx 'launch_status=AUTHORIZED' "$OUT7"
          grep -Fx "pipeline_run_id=$RUN_ID" "$OUT7"
          grep -Fx "source_commit=$ALFA_SOURCE_COMMIT" "$OUT7"
          echo "ALFA_GATE7_ASSET=$OUT7" >> "$GITHUB_ENV"
          echo "ALFA_PIPELINE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo CURRENT_RUN_GATE7=PASS

      - name: Enable KVM hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm4all"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm
          echo KVM_READY=PASS

      - name: Create Android Virtual Device
        shell: bash
        run: |
          set -euo pipefail
          avdmanager create avd --force --name g2-api35 --package 'system-images;android-35;google_apis;x86_64' --device 'pixel_2' </dev/null
          emulator -list-avds | grep -Fx g2-api35
          echo AVD_CREATED=PASS

      - name: Start Android Emulator and prove target readiness
        shell: bash
        run: |
          set -euo pipefail
          emulator -avd g2-api35 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > "$RUNNER_TEMP/emulator.log" 2>&1 &
          EMULATOR_PID=$!
          echo "EMULATOR_PID=$EMULATOR_PID" >> "$GITHUB_ENV"
          adb wait-for-device
          for i in $(seq 1 120); do
            if adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1$'; then break; fi
            sleep 2
          done
          adb shell getprop sys.boot_completed | tr -d '\r' | grep -q '^1$'
          adb shell getprop ro.build.version.sdk
          adb shell getprop ro.product.cpu.abi
          adb devices
          echo ANDROID_TARGET_READY=PASS

      - name: Run exactly RuntimeKeepAliveFourSessionLifecycleDutTest
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.alfa.device_ctrl.RuntimeKeepAliveFourSessionLifecycleDutTest \
            --no-daemon --stacktrace
          echo G2_INSTRUMENTATION_EXECUTION=PASS

      - name: Collect execution evidence
        if: always()
        shell: bash
        run: |
          set +e
          adb shell ps -A | grep -F 'com.alfa.device_ctrl' || true
          adb shell dumpsys activity activities | grep -F 'com.alfa.device_ctrl' || true
          find app/build/outputs -maxdepth 7 -type f -print 2>/dev/null || true
          find app/build/reports -maxdepth 7 -type f -print 2>/dev/null || true
          cat "$RUNNER_TEMP/emulator.log" 2>/dev/null || true

      - name: Upload Android instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-four-session-lifecycle-evidence-${{ github.sha }}
          path: |
            app/build/outputs/androidTest-results/**
            app/build/outputs/connected_android_test_additional_output/**
            app/build/reports/androidTests/**
            app/build/test-results/**
            ${{ runner.temp }}/emulator.log
          if-no-files-found: warn
