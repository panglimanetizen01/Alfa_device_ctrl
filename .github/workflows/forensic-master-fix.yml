name: One-shot forensic APK fix

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  forensic-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '8.11.1'

      - name: Prepare Android SDK and loader
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "ndk;28.0.13004108"
          ./gradlew :app:prepareProotLoader --no-daemon --stacktrace

      - name: TDD RED
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --tests com.alfa.device_ctrl.RuntimeInstallerSymlinkSecurityTest.absoluteSymlinkTargetIsRebasedInsideRootfs --no-daemon --stacktrace
          rc=$?
          set -e
          test "$rc" -ne 0
          echo "TDD_RED=PASS"

      - name: Apply root-cause fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
from pathlib import Path
path = Path('app/src/main/java/com/alfa/device_ctrl/RuntimeInstaller.java')
text = path.read_text(encoding='utf-8')
old = 'try{Files.createSymbolicLink(target,Paths.get(link));}catch(FileAlreadyExistsException ignored){}'
new = 'try{Path symlinkTarget=target.getParent().relativize(lt);Files.createSymbolicLink(target,symlinkTarget);}catch(FileAlreadyExistsException ignored){}'
if text.count(old) != 1:
    raise SystemExit('expected exactly one vulnerable symlink creation site')
path.write_text(text.replace(old, new), encoding='utf-8')
PY
          grep -F 'relativize(lt)' app/src/main/java/com/alfa/device_ctrl/RuntimeInstaller.java

      - name: TDD GREEN
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest --tests com.alfa.device_ctrl.RuntimeInstallerSymlinkSecurityTest.absoluteSymlinkTargetIsRebasedInsideRootfs --no-daemon --stacktrace
          echo "TDD_GREEN=PASS"

      - name: Build debug APK
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt

      - name: Remove one-shot workflow and commit verified fix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/forensic-master-fix.yml
          git add app/src/main/java/com/alfa/device_ctrl/RuntimeInstaller.java app/src/test/java/com/alfa/device_ctrl/RuntimeInstallerSymlinkSecurityTest.java
          git commit -m 'fix(runtime): confine extracted symlink targets [forensic-autofix]'
          git push origin HEAD:master
