name: Alfa UI Contract

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Execute final UI unit contract
        run: ./gradlew :app:testDebugUnitTest --tests com.alfa.device_ctrl.AlfaUiForensicDesignContractTest --tests com.alfa.device_ctrl.AlfaFinalUiPresentationContractTest --tests com.alfa.device_ctrl.StitchV1ReferenceCatalogTest --tests com.alfa.device_ctrl.AlfaUiNavigationContractTest -x :app:prepareGate7LaunchContract -x :app:prepareProotLoader
      - name: Execute terminal renderer contract
        run: ./gradlew :terminal-view:testDebugUnitTest --tests com.termux.view.TerminalRendererLineSpacingTest
