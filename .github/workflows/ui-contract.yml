name: Alfa UI Contract

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  ALFA_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  ui-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.ALFA_SOURCE_COMMIT }}
          fetch-depth: 0
      - name: Verify exact source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ALFA_SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          echo "EXPECTED_SOURCE_COMMIT=$ALFA_SOURCE_COMMIT"
          echo "ACTUAL_HEAD=$(git rev-parse HEAD)"
          echo "SOURCE_STATUS=$(git status --porcelain)"
          echo "ACTUAL_TREE=$(git rev-parse HEAD^{tree})"
          git diff --exit-code "$ALFA_SOURCE_COMMIT" -- .
          echo "EXACT_SOURCE_IDENTITY=PASS"
      - name: Execute final UI unit contract
        run: ./gradlew :app:testDebugUnitTest --tests com.alfa.device_ctrl.AlfaUiForensicDesignContractTest --tests com.alfa.device_ctrl.AlfaFinalUiPresentationContractTest --tests com.alfa.device_ctrl.StitchV1ReferenceCatalogTest --tests com.alfa.device_ctrl.StitchV1StateModelContractTest --tests com.alfa.device_ctrl.StitchV1ArtifactBoundaryTest --tests com.alfa.device_ctrl.AlfaUiNavigationContractTest --tests com.alfa.device_ctrl.TerminalClipboardBridgeContractTest -x :app:prepareGate7LaunchContract -x :app:prepareProotLoader
      - name: Execute terminal renderer contract
        run: ./gradlew :terminal-view:testDebugUnitTest --tests com.termux.view.TerminalRendererLineSpacingTest
