name: Stitch v1 Forensic Audit
on:
  push:
    branches: [work/stitch-native-implementation]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run deep Stitch corpus forensic
        run: python3 tools/stitch_v1_forensic.py stitch/stitch_alfa_device_control_v1.0.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: stitch-v1-forensic-inventory
          path: stitch-forensic
