name: Stitch v1 Forensic Audit
on:
  push:
    branches: [work/stitch-native-implementation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Inventory Stitch artifact
        run: |
          set -euo pipefail
          z=stitch/stitch_alfa_device_control_v1.0.0.zip
          test -f "$z"
          s=$(sha256sum "$z" | cut -d' ' -f1)
          echo "ZIP_SHA256=$s"
          test "$s" = 7b3428e474e7c778a11fecf995d417bc1b6d5d9575a879fa9da1e86eb637895d
          rm -rf stitch-forensic
          mkdir stitch-forensic
          unzip -q "$z" -d stitch-forensic/extracted
          unzip -Z1 "$z" | sort > stitch-forensic/zip-file-list.txt
          find stitch-forensic/extracted -type f -print | sort > stitch-forensic/extracted-file-list.txt
          echo "code.html=$(find stitch-forensic/extracted -type f -name code.html | wc -l)"
          echo "png=$(find stitch-forensic/extracted -type f -iname '*.png' | wc -l)"
          echo "md=$(find stitch-forensic/extracted -type f -iname '*.md' | wc -l)"
          echo "total=$(find stitch-forensic/extracted -type f | wc -l)"
      - uses: actions/upload-artifact@v4
        with:
          name: stitch-v1-forensic-inventory
          path: stitch-forensic
