name: Production Transport Bridge CI

on:
  pull_request:
  push:
    branches: [master, work/production-transport-bridges-20260918]
    paths:
      - 'app/src/main/**'
      - 'app/src/test/**'
      - 'app/build.gradle'
      - '.github/workflows/production-transport-bridge-ci.yml'
      - 'build.gradle'
      - 'settings.gradle'

jobs:
  transport-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Diagnose sdkmanager launcher before NDK install
        run: |
          set -u
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          printf '%s\n' '=== JAVA ==='
          java -version 2>&1
          printf 'JAVA_HOME=%s\n' "${JAVA_HOME:-}"
          printf '%s\n' '=== SDK ==='
          printf 'SDK_ROOT=%s\n' "$SDK_ROOT"
          printf 'ANDROID_SDK_ROOT=%s\n' "${ANDROID_SDK_ROOT:-}"
          printf 'ANDROID_HOME=%s\n' "${ANDROID_HOME:-}"
          printf 'SDKMANAGER=%s\n' "$SDKMANAGER"
          realpath "$SDKMANAGER" 2>&1 || true
          file "$SDKMANAGER" 2>&1 || true
          stat -c 'mode=%a perms=%A owner=%U:%G size=%s path=%n' "$SDKMANAGER" 2>&1 || true
          printf '%s\n' '=== CMDLINE TOOLS TREE ==='
          ls -la "$SDK_ROOT" 2>&1 || true
          ls -la "$SDK_ROOT/cmdline-tools" 2>&1 || true
          find "$SDK_ROOT/cmdline-tools/16.0" -maxdepth 3 -printf '%M %u:%g %s %p\n' 2>&1 || true
          printf '%s\n' '=== LAUNCHER CONTENT ==='
          sed -n '1,240p' "$SDKMANAGER" 2>&1 || true
          printf '%s\n' '=== RELEVANT JARS/CLASSPATH ==='
          find "$SDK_ROOT/cmdline-tools/16.0" -type f \( -name '*.jar' -o -name 'java' \) -printf '%p %s bytes\n' 2>&1 || true
          printf '%s\n' '=== SDK ROOT STRUCTURE ==='
          find "$SDK_ROOT" -maxdepth 2 -printf '%M %u:%g %s %p\n' 2>&1 | sort || true
          printf '%s\n' '=== SDKMANAGER VERSION STDOUT ==='
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --version >sdkmanager-version.stdout 2>sdkmanager-version.stderr
          version_status=$?
          cat sdkmanager-version.stdout
          printf '%s\n' '=== SDKMANAGER VERSION STDERR ==='
          cat sdkmanager-version.stderr
          printf 'SDKMANAGER_VERSION_EXIT=%s\n' "$version_status"
          printf '%s\n' '=== SDKMANAGER VERSION LAUNCHER TRACE ==='
          bash -x "$SDKMANAGER" --sdk_root="$SDK_ROOT" --version >sdkmanager-version.trace.stdout 2>sdkmanager-version.trace.stderr
          trace_status=$?
          cat sdkmanager-version.trace.stdout
          cat sdkmanager-version.trace.stderr
          printf 'SDKMANAGER_VERSION_TRACE_EXIT=%s\n' "$trace_status"
          printf '%s\n' '=== SDKMANAGER LIST STDOUT ==='
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --list >sdkmanager-list.stdout 2>sdkmanager-list.stderr
          list_status=$?
          cat sdkmanager-list.stdout
          printf '%s\n' '=== SDKMANAGER LIST STDERR ==='
          cat sdkmanager-list.stderr
          printf 'SDKMANAGER_LIST_EXIT=%s\n' "$list_status"
          printf '%s\n' '=== JAVA/CMDLINE-TOOLS PROCESS ENVIRONMENT ==='
          printf 'PATH=%s\n' "$PATH"
          command -v java 2>&1 || true
          command -v "$SDKMANAGER" 2>&1 || true
          printf '%s\n' '=== DIAGNOSTIC EXIT ==='
          test "$version_status" -eq 0
          test "$trace_status" -eq 0
          test "$list_status" -eq 0
      - name: Install NDK 28.0.13004108 required by existing PRoot loader contract
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;28.0.13004108"
      - name: Run production transport contract
        run: ./gradlew :app:testDebugUnitTest --tests com.alfa.device_ctrl.ProductionTransportContractTest --no-daemon
