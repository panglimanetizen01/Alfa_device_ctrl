name: Production Transport Bridge CI

on:
  pull_request:
  push:
    branches: [master, work/production-transport-bridges-20260918]
    paths:
      - 'app/src/main/**'
      - 'app/src/test/**'
      - 'app/build.gradle'
      - '.github/workflows/production-transport-bridge-ci.yml'
      - 'build.gradle'
      - 'settings.gradle'

jobs:
  transport-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve and validate sdkmanager launcher
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ -x "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          else
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          SDKMANAGER="$(realpath "$SDKMANAGER")"
          test -x "$SDKMANAGER"
          printf 'SDK_ROOT=%s\n' "$SDK_ROOT"
          printf 'SDKMANAGER=%s\n' "$SDKMANAGER"
          printf 'SDKMANAGER_REALPATH=%s\n' "$SDKMANAGER"
          echo "ALFA_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ALFA_SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Verify sdkmanager
        run: |
          set -euo pipefail
          "$ALFA_SDKMANAGER" --sdk_root="$ALFA_SDK_ROOT" --version
          "$ALFA_SDKMANAGER" --sdk_root="$ALFA_SDK_ROOT" --list
      - name: Install NDK 28.0.13004108 required by existing PRoot loader contract
        run: |
          set -euo pipefail
          test -x "$ALFA_SDKMANAGER"
          yes | "$ALFA_SDKMANAGER" --sdk_root="$ALFA_SDK_ROOT" --licenses >/dev/null
          "$ALFA_SDKMANAGER" --sdk_root="$ALFA_SDK_ROOT" --install "ndk;28.0.13004108"
      - name: Verify NDK
        run: |
          set -euo pipefail
          test -x "$ALFA_SDK_ROOT/ndk/28.0.13004108/ndk-build"
          "$ALFA_SDKMANAGER" --sdk_root="$ALFA_SDK_ROOT" --list | grep -F 'ndk;28.0.13004108'
      - name: Run production transport contract
        run: ./gradlew :app:testDebugUnitTest --tests com.alfa.device_ctrl.ProductionTransportContractTest --no-daemon
