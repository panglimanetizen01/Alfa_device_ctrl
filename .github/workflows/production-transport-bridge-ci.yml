name: Production Transport Bridge CI

on:
  pull_request:
  push:
    branches: [master, work/production-transport-bridges-20260918]
    paths:
      - 'app/src/main/**'
      - 'app/src/test/**'
      - 'app/build.gradle'
      - '.github/workflows/production-transport-bridge-ci.yml'
      - 'build.gradle'
      - 'settings.gradle'

jobs:
  transport-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK 28.0.13004108 required by existing PRoot loader contract
        run: |
          set -euo pipefail
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "ndk;28.0.13004108"
      - name: Run production transport contract
        run: ./gradlew :app:testDebugUnitTest --tests com.alfa.device_ctrl.ProductionTransportContractTest --no-daemon
