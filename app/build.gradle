plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alfa.device_ctrl'
    compileSdk 36

    sourceSets {
        main {
            jniLibs.srcDir("$buildDir/generated/jniLibs")
            assets.srcDir("$buildDir/generated/assets")
        }
    }

    packaging {
        jniLibs {
            // RuntimeInstaller executes libproot.so from ApplicationInfo.nativeLibraryDir.
            // The APK must therefore use Android's legacy JNI packaging extraction boundary.
            useLegacyPackaging true
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    defaultConfig {
        applicationId 'com.alfa.device_ctrl'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
}

def prootLoaderOutput = file("$buildDir/generated/jniLibs/arm64-v8a/libproot-loader.so")

tasks.register('prepareProotLoader', Exec) {
    inputs.file(file("$rootDir/tools/build_proot_loader.sh"))
    outputs.file(prootLoaderOutput)
    workingDir rootProject.projectDir
    environment 'PROOT_LOADER_OUT', prootLoaderOutput.absolutePath
    commandLine 'bash', 'tools/build_proot_loader.sh'
}

tasks.register('prepareGate7LaunchContract') {
    inputs.property('gate7AssetPath', providers.environmentVariable('ALFA_GATE7_ASSET').orElse(''))
    inputs.property('gate7RuntimeId', providers.environmentVariable('ALFA_GATE7_RUNTIME_ID').orElse(''))
    outputs.file(file("$buildDir/generated/assets/gate7-launch.properties"))
    doLast {
        def sourcePath = System.getenv('ALFA_GATE7_ASSET')
        def selectedRuntime = System.getenv('ALFA_GATE7_RUNTIME_ID')
        def output = file("$buildDir/generated/assets/gate7-launch.properties")
        output.parentFile.mkdirs()
        output.delete()
        if (sourcePath == null || sourcePath.trim().isEmpty()) {
            throw new GradleException('APK readiness is blocked: current-run Gate 7 launch provenance is missing (ALFA_GATE7_ASSET)')
        }
        if (selectedRuntime == null || selectedRuntime.trim().isEmpty()) {
            throw new GradleException('ALFA_GATE7_RUNTIME_ID is required when Gate 7 asset is supplied')
        }
        def registryFile = file("${rootProject.projectDir}/runtime/runtimes.v1.json")
        def registry = new groovy.json.JsonSlurper().parse(registryFile)
        def runtime = registry.runtimes.find { it.runtime_id == selectedRuntime.trim() }
        if (runtime == null) throw new GradleException("Gate 7 runtime is not in canonical registry: ${selectedRuntime}")
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        def registryHash = digest.digest(registryFile.bytes).collect { String.format('%02x', it) }.join()
        def source = file(sourcePath)
        if (!source.isFile()) throw new GradleException("ALFA_GATE7_ASSET is not a regular file: ${source}")
        def text = source.getText('UTF-8')
        ['pipeline_run_id=', 'runtime_id=', 'runtime_registry_sha256=', 'source_commit=', 'gate4_contract_sha256=', 'profile_sha256=', 'implementation_commit='].each { key ->
            if (!text.readLines().any { it.startsWith(key) && it.substring(key.length()).trim() }) {
                throw new GradleException("Gate 7 launch contract missing ${key}")
            }
        }
        def lines = text.readLines()
        def value = { key ->
            def prefix = key.endsWith('=') ? key : "${key}="
            lines.find { it.startsWith(prefix) }?.substring(prefix.length())?.trim()
        }
        if (value('runtime_id') != selectedRuntime.trim()) {
            throw new GradleException("Gate 7 runtime provenance mismatch: asset=${value('runtime_id')} selected=${selectedRuntime}")
        }
        if (value('runtime_registry_sha256') != registryHash) {
            throw new GradleException("Gate 7 runtime registry provenance is stale: asset=${value('runtime_registry_sha256')} canonical=${registryHash}")
        }
        source.withInputStream { input -> output.withOutputStream { out -> out << input } }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareProotLoader')
    dependsOn tasks.named('prepareGate7LaunchContract')
}

tasks.named('testDebugUnitTest').configure {
    dependsOn tasks.named('prepareProotLoader')
}

dependencies {
    implementation project(":terminal-view")
    implementation 'org.tukaani:xz:1.12'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
