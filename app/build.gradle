plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alfa.device_ctrl'
    compileSdk 35

    sourceSets {
        main {
            jniLibs.srcDir("$buildDir/generated/jniLibs")
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    defaultConfig {
        applicationId 'com.alfa.device_ctrl'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
}

tasks.register('prepareProotLoader', Exec) {
    workingDir rootProject.projectDir
    environment 'PROOT_LOADER_OUT', file("$buildDir/generated/jniLibs/arm64-v8a/libproot-loader.so").absolutePath
    commandLine 'bash', 'tools/build_proot_loader.sh'
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareProotLoader')
}

tasks.withType(Test).configureEach {
    dependsOn tasks.named('prepareProotLoader')
}

dependencies {
    implementation project(":terminal-view")
    implementation 'org.tukaani:xz:1.12'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
