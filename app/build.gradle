plugins {
    id 'com.android.application'
}

def alfaSourceCommit = providers.environmentVariable('ALFA_SOURCE_COMMIT')
        .orElse(providers.exec { commandLine 'git', 'rev-parse', 'HEAD' }.standardOutput.asText.map { it.trim() })
        .get()
if (!(alfaSourceCommit ==~ /[0-9a-f]{40}/)) {
    throw new GradleException("ALFA_SOURCE_COMMIT must be a 40-character git SHA: ${alfaSourceCommit}")
}

android {
    namespace 'com.alfa.device_ctrl'
    testNamespace 'com.alfa.device_ctrl.test'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    defaultConfig {
        applicationId 'com.alfa.device_ctrl'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'ALFA_SOURCE_COMMIT', '"' + alfaSourceCommit + '"'
    }
}

dependencies {
    implementation project(":terminal-view")
    implementation 'org.tukaani:xz:1.9'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}